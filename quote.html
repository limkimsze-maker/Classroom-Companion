<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5aa85a">
<title>Quote of the Day</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#8ed8f2;color:#17332f}.garden{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#8ed8f2 0 55%,#9bdd76 55% 100%)}.sun{position:absolute;right:7vw;top:6vh;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fff8b8 0 22%,#ffd95c 55%,#ffbe3b 100%);box-shadow:0 0 55px rgba(255,214,75,.75)}.cloud{position:absolute;font-size:clamp(54px,7vw,100px);filter:drop-shadow(0 5px 8px rgba(30,70,90,.09));opacity:.94;user-select:none}.c1{left:7vw;top:7vh}.c2{left:45vw;top:12vh;transform:scale(.72)}.hill{position:absolute;bottom:-17vh;width:72vw;height:46vh;border-radius:50% 50% 0 0}.h1{left:-13vw;background:#68bb5f}.h2{right:-15vw;background:#57a953}.path{position:absolute;left:50%;bottom:-4vh;transform:translateX(-50%);width:24vw;height:45vh;background:linear-gradient(180deg,#f6e6b1,#d9bc7e);clip-path:polygon(43% 0,57% 0,90% 100%,10% 100%);opacity:.95}.flowers{position:absolute;left:0;right:0;bottom:2vh;text-align:center;font-size:clamp(28px,4vw,58px);letter-spacing:.16em;filter:drop-shadow(0 3px 2px rgba(0,0,0,.08));white-space:nowrap}.butterfly{position:absolute;font-size:clamp(28px,3.5vw,54px);animation:qFloat 5s ease-in-out infinite}.b1{left:14vw;top:33vh}.b2{right:13vw;top:29vh;animation-delay:-2s}.b3{right:28vw;bottom:18vh;animation-delay:-3.5s}@keyframes qFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(5deg)}}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,88vw);background:rgba(255,255,255,.94);border:4px solid rgba(255,255,255,.82);border-radius:34px;padding:clamp(24px,4vw,48px);box-shadow:0 24px 70px rgba(28,73,58,.24);text-align:center;backdrop-filter:blur(8px)}.eyebrow{font-size:clamp(16px,2vw,23px);font-weight:950;letter-spacing:.05em;color:#14756c;text-transform:uppercase;margin-bottom:18px}.quote{font-size:clamp(34px,5vw,66px);line-height:1.16;font-weight:950;letter-spacing:-.035em;text-wrap:balance}.encourage{margin-top:18px;font-size:clamp(17px,2vw,24px);font-weight:800;color:#3b625c}.voice{margin-top:10px;font-size:13px;font-weight:800;color:#68807c;min-height:20px}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}.btn{border:0;border-radius:14px;padding:12px 17px;font:inherit;font-size:15px;font-weight:950;cursor:pointer;background:#fff;color:#17332f;box-shadow:0 4px 12px rgba(23,51,47,.12)}.btn.primary{background:#0f766e;color:#fff}.btn.stop{background:#fff0ee;color:#a92a20}.btn.close{background:#17332f;color:#fff}.btn:focus-visible{outline:4px solid #ffd95c;outline-offset:2px}@media(max-width:650px){.panel{width:92vw;border-radius:24px;padding:22px 18px}.controls{gap:7px}.btn{padding:10px 12px;font-size:13px}.sun{width:80px;height:80px}.flowers{letter-spacing:.05em}.quote{font-size:clamp(31px,9vw,52px)}}
</style>
</head>
<body>
<main class="garden">
<div class="sun" aria-hidden="true"></div><div class="cloud c1" aria-hidden="true">☁️</div><div class="cloud c2" aria-hidden="true">☁️</div><div class="hill h1" aria-hidden="true"></div><div class="hill h2" aria-hidden="true"></div><div class="path" aria-hidden="true"></div><div class="butterfly b1" aria-hidden="true">🦋</div><div class="butterfly b2" aria-hidden="true">🦋</div><div class="butterfly b3" aria-hidden="true">🐝</div><div class="flowers" aria-hidden="true">🌼 🌷 🌻 🌸 🌺 🌼 🌷 🌻 🌸 🌺 🌼</div>
<section class="panel" role="dialog" aria-label="Quote of the Day"><div class="eyebrow">✨ Today’s Encouraging Thought ✨</div><div class="quote" id="quoteText"></div><div class="encourage">One small step at a time. You can keep learning.</div><div class="voice" id="voiceNote">Preparing UK English voice…</div><div class="controls"><button class="btn primary" id="read">🔊 Read Again</button><button class="btn" id="pause">⏸ Pause</button><button class="btn stop" id="stop">⏹ Stop</button><button class="btn" id="another">🎲 New Quote</button><button class="btn close" id="close">✕ Close</button></div></section>
</main>
<script>
'use strict';
const quotes=['You do not have to understand everything at once. Learn one step at a time.','Slow progress is still progress. Keep the next step small and clear.','Not knowing yet is the beginning of learning.','A hard question is not a stop sign. Try a different strategy.','Your first answer does not need to be perfect. It only needs to get you started.','Mistakes show you what to work on next.','When one way does not work, change the way — not the goal.','Ask for help when you need it. Strong learners do.','You can learn difficult things by breaking them into smaller parts.','Today, aim to understand one thing better than yesterday.','Getting stuck does not mean you cannot learn it. It means you need a next move.','Try, check, change, and try again. That is learning.','You are allowed to take your time. Keep thinking.','One careful step is better than rushing through ten.','If the work feels hard, choose one part you can do first.','Every time you correct a mistake, your understanding gets stronger.','You do not need to be the fastest learner. You need to keep learning.','A small success today can become confidence tomorrow.','Say what you know first. Then work out what is missing.','When you feel unsure, use a strategy instead of giving up.','Learning can feel difficult before it starts to feel familiar.','Compare your work with your last attempt, not with someone else’s.','You can pause, think, and try again.','A question you ask today can unlock something tomorrow.','Keep the parts you understand and work on one confusing part at a time.','Effort helps most when you also change your strategy.','You have learnt hard things before. Use the same patience again.','Read it again. Draw it. Say it. Try another way.','Being confused is a signal to slow down and look for the next clue.','You do not have to get it right immediately to get better at it.','Keep going until the next small step makes sense.'];
const synth=window.speechSynthesis,$=id=>document.getElementById(id);let currentIndex=-1;
function dayIndex(){const d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/86400000)%quotes.length}
function showQuote(i){currentIndex=((i%quotes.length)+quotes.length)%quotes.length;$('quoteText').textContent=quotes[currentIndex]}
function chooseVoice(){if(!synth)return null;const vs=synth.getVoices()||[],female=/female|sonia|libby|hazel|serena|susan|kate|emma|emily|amy|fiona|samantha|moira|victoria/i,uk=vs.filter(v=>/^en[-_]GB$/i.test(v.lang||'')||/united kingdom|british|uk english/i.test(v.name||''));return uk.find(v=>female.test(v.name||''))||uk[0]||vs.find(v=>/^en/i.test(v.lang||'')&&female.test(v.name||''))||vs.find(v=>/^en/i.test(v.lang||''))||vs[0]||null}
function readyVoice(timeout=900){return new Promise(resolve=>{if(!synth){resolve(null);return}const v=chooseVoice();if(v){resolve(v);return}let done=false;const finish=()=>{if(done)return;done=true;synth.removeEventListener?.('voiceschanged',on);resolve(chooseVoice())},on=()=>finish();synth.addEventListener?.('voiceschanged',on,{once:true});setTimeout(finish,timeout)})}
async function speak(){if(!synth){$('voiceNote').textContent='Text-to-speech is not available in this browser.';return}synth.cancel();$('pause').textContent='⏸ Pause';const v=await readyVoice();const u=new SpeechSynthesisUtterance($('quoteText').textContent);u.lang='en-GB';u.rate=.86;u.pitch=1.04;u.volume=1;if(v){u.voice=v;$('voiceNote').textContent='Voice: '+v.name}else $('voiceNote').textContent='UK English voice preference enabled';u.onerror=()=>{$('voiceNote').textContent='Tap Read Again if automatic speech was blocked.'};synth.speak(u)}
function stopSpeech(){try{synth?.cancel()}catch(e){}$('pause').textContent='⏸ Pause'}
function closeQuote(){stopSpeech();try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return}}catch(e){}history.back()}
$('read').onclick=speak;$('pause').onclick=()=>{if(!synth)return;if(synth.paused){synth.resume();$('pause').textContent='⏸ Pause'}else if(synth.speaking){synth.pause();$('pause').textContent='▶ Resume'}else speak()};$('stop').onclick=stopSpeech;$('another').onclick=()=>{let i=currentIndex;while(i===currentIndex)i=Math.floor(Math.random()*quotes.length);showQuote(i);speak()};$('close').onclick=closeQuote;window.addEventListener('beforeunload',stopSpeech);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuote()});showQuote(dayIndex());setTimeout(speak,120);
</script>
</body>
</html>
