<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b2b">
<title>Full-Screen Clock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071b2b;color:#fff}.page{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#164e63 0,#0b3142 35%,#071b2b 72%,#04111c 100%)}.orb{position:absolute;border-radius:50%;filter:blur(1px);opacity:.25}.o1{width:34vw;height:34vw;background:#22d3ee;left:-12vw;top:-15vw}.o2{width:28vw;height:28vw;background:#34d399;right:-10vw;bottom:-13vw}.clock-card{position:relative;text-align:center;width:min(1500px,95vw);padding:4vh 3vw}.label{font-size:clamp(15px,1.6vw,26px);font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#9ee8e0;margin-bottom:2vh}.time{font-variant-numeric:tabular-nums;font-size:clamp(104px,22vw,330px);font-weight:1000;line-height:.88;letter-spacing:-.065em;text-shadow:0 10px 40px rgba(0,0,0,.28)}.seconds{font-size:.34em;vertical-align:top;position:relative;top:.08em;margin-left:.08em;color:#9ee8e0;letter-spacing:-.03em}.ampm{font-size:.22em;vertical-align:top;position:relative;top:.11em;margin-left:.12em;color:#fef3c7;letter-spacing:.03em}.date{font-size:clamp(26px,4vw,58px);font-weight:850;margin-top:4vh;color:#e6fffb}.hint{font-size:clamp(13px,1.3vw,19px);font-weight:750;color:#9fb7c5;margin-top:1.5vh}.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:18px;background:rgba(3,16,27,.62);backdrop-filter:blur(12px);transition:opacity .25s}.controls.hide{opacity:0;pointer-events:none}.btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;min-height:42px;padding:9px 14px;font:inherit;font-size:14px;font-weight:900;cursor:pointer}.btn.active{background:#0f766e;border-color:#5eead4}.btn.close{background:#fff;color:#17324d}.btn:focus-visible{outline:4px solid #facc15;outline-offset:2px}@media(max-width:700px){.time{font-size:clamp(78px,26vw,180px)}.date{font-size:clamp(22px,6vw,38px)}.controls{width:calc(100vw - 18px)}}
</style>
</head>
<body>
<main class="page" id="page">
  <div class="orb o1"></div><div class="orb o2"></div>
  <section class="clock-card">
    <div class="label">Classroom Clock</div>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
    <div class="hint">Tap anywhere to show controls</div>
  </section>
</main>
<div class="controls" id="controls">
  <button class="btn" id="format">24-hour</button>
  <button class="btn" id="secondsBtn">Seconds Off</button>
  <button class="btn" id="dateBtn">Date On</button>
  <button class="btn" id="fullBtn">⛶ Full Screen</button>
  <button class="btn close" id="closeBtn">✕ Close</button>
</div>
<script>
'use strict';
const params=new URLSearchParams(location.search);let is24=params.get('format')!=='12',showSeconds=params.get('seconds')==='1',showDate=params.get('date')!=='0';const $=s=>document.querySelector(s);let hideId=null;
function update(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();let hour=is24?h:(h%12||12);const main=`${String(hour).padStart(2,'0')}:${String(m).padStart(2,'0')}`;const sec=showSeconds?`<span class="seconds">:${String(s).padStart(2,'0')}</span>`:'';const ap=!is24?`<span class="ampm">${h<12?'AM':'PM'}</span>`:'';$('#time').innerHTML=main+sec+ap;$('#date').textContent=showDate?d.toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';$('#format').textContent=is24?'24-hour':'12-hour';$('#format').classList.toggle('active',is24);$('#secondsBtn').textContent=showSeconds?'Seconds On':'Seconds Off';$('#secondsBtn').classList.toggle('active',showSeconds);$('#dateBtn').textContent=showDate?'Date On':'Date Off';$('#dateBtn').classList.toggle('active',showDate)}
function showControls(){const c=$('#controls');c.classList.remove('hide');clearTimeout(hideId);hideId=setTimeout(()=>c.classList.add('hide'),4500)}
async function enterFull(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'});showControls()}catch(e){try{window.moveTo(0,0);window.resizeTo(screen.availWidth,screen.availHeight)}catch(_){}}}
function closeMe(){try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'classroom-companion-return-to-strip'},location.origin);window.opener.focus()}}catch(e){}window.close();setTimeout(()=>history.back(),120)}
$('#format').onclick=()=>{is24=!is24;update();showControls()};$('#secondsBtn').onclick=()=>{showSeconds=!showSeconds;update();showControls()};$('#dateBtn').onclick=()=>{showDate=!showDate;update();showControls()};$('#fullBtn').onclick=enterFull;$('#closeBtn').onclick=closeMe;$('#page').onclick=showControls;document.addEventListener('keydown',e=>{if(e.key==='Escape')showControls()});setInterval(update,250);update();showControls();try{window.moveTo(0,0);window.resizeTo(screen.availWidth,screen.availHeight)}catch(e){}setTimeout(()=>enterFull(),80);
</script>
</body>
</html>
