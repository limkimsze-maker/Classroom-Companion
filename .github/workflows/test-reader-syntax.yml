name: Reader syntax regression
on:
  push:
    branches: [fix/reader-script-syntax-20261018]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-reader-syntax.cjs]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-trained-remaining-58.cjs
      - run: node scripts/test-trained-j-beta.cjs
      - run: node scripts/test-equals-geometry.cjs
