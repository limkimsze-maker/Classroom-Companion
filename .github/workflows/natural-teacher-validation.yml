name: Natural teacher ink validation workflow
on:
  push:
    paths:
      - handwriting-teacher-validation.html
      - validation/priority6/**
      - scripts/benchmark-natural-teacher-ink.cjs
      - scripts/test-natural-teacher-validation*.cjs
      - .github/workflows/natural-teacher-validation.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the frozen reader and scoring protocol
        run: node scripts/test-natural-teacher-validation.cjs
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --prefix /tmp/natural-ink-check playwright@1.51.1
          /tmp/natural-ink-check/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Verify drawing, blind scoring and independent replay
        env:
          NODE_PATH: /tmp/natural-ink-check/node_modules
        run: node scripts/test-natural-teacher-validation-browser.cjs
