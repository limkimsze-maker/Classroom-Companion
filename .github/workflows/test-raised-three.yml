name: Raised three contour
on:
  push:
    branches: [fix/superscript-three-contour-20261019]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-raised-three-contour.cjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-raised-three-contour.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-unit-first-exponent.cjs
      - run: node scripts/test-teacher-confusables.cjs
