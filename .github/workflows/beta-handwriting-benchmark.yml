name: Beta handwriting 924-case benchmark
on:
  push:
    paths:
      - .github/workflows/beta-handwriting-benchmark.yml
      - whiteboard-handwriting-recognition-beta.js
      - scripts/compare-handwriting-engines.cjs
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original 924-case UJI V1 benchmark on current Beta reader
        run: node scripts/benchmark-handwriting-simulations.cjs --split all --out beta-handwriting-current-results.json
      - name: Print category breakdown and historical comparison
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const now=JSON.parse(fs.readFileSync('beta-handwriting-current-results.json'));
          const old=JSON.parse(fs.readFileSync('handwriting-context-results.json'));
          const records=old.records||[];
          const base={correct:records.filter(x=>x.afterCorrect).length,total:records.length};
          console.log('HISTORICAL',JSON.stringify(base));
          console.log('CURRENT',JSON.stringify(now.summary));
          console.log('CATEGORIES',JSON.stringify(now.by,null,2));
          const previous=new Map(records.map(x=>[x.id,x]));
          const changes=now.records.filter(x=>previous.has(x.id));
          const fixed=changes.filter(x=>!previous.get(x.id).afterCorrect&&x.correct);
          const regressed=changes.filter(x=>previous.get(x.id).afterCorrect&&!x.correct);
          const wrong=changes.filter(x=>!x.correct);
          const counts={};
          for(const x of wrong){const k=x.category+' '+x.expected+' => '+x.actual;counts[k]=(counts[k]||0)+1;}
          console.log('FIXED_CASES',JSON.stringify(fixed.map(x=>x.id)));
          console.log('REGRESSED_CASES',JSON.stringify(regressed.map(x=>x.id)));
          console.log('TOP_FAILURES',JSON.stringify(Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,20)));
          const targeted=now.records.filter(x=>!x.correct&&
            (x.expected==='35cm²'||x.expected==='6−2=4cm²'));
          console.log('SQUARE_TO_CUBE_DIAGNOSIS',JSON.stringify(targeted.map(x=>({
            id:x.id,partition:x.partition,expected:x.expected,actual:x.actual,
            engine:x.engine,flagged:x.flagged
          }))));
          const engines={};
          for(const x of targeted){const k=x.engine||'unknown';engines[k]=(engines[k]||0)+1;}
          console.log('SQUARE_TO_CUBE_ENGINES',JSON.stringify(engines));
          // Expose every remaining exponent failure before changing recognition
          // rules. These are immutable benchmark cases, not training examples.
          const exponentFailures=now.records.filter(x=>!x.correct&&
            (x.category==='powers'||x.category==='measuredArithmetic'));
          console.log('EXPONENT_FAILURES',JSON.stringify(exponentFailures.map(x=>({
            id:x.id,partition:x.partition,expected:x.expected,actual:x.actual,
            engine:x.engine,flagged:x.flagged
          }))));
          const exponentMatrix={};
          for(const x of now.records.filter(x=>x.category==='powers'||x.category==='measuredArithmetic')){
            const k=x.expected+' / '+(x.engine||'unknown');
            const cell=exponentMatrix[k]??={correct:0,wrong:0,flaggedWrong:0};
            if(x.correct)cell.correct++;
            else{cell.wrong++;if(x.flagged)cell.flaggedWrong++;}
          }
          console.log('EXPONENT_ENGINE_MATRIX',JSON.stringify(exponentMatrix));

          console.log('BUILD',now.build,'READER_SHA256',now.readerSha256);
          NODE
      - name: Compare component and whole-unit engines on identical ink
        run: node scripts/compare-handwriting-engines.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: beta-handwriting-924-current
          path: |
            beta-handwriting-current-results.json
            beta-handwriting-engine-comparison.json
