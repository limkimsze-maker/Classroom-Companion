name: Build isolated CoMER Beta Lab
on:
  push:
    branches:
      - feature/comer-handwriting-beta-20261018
    paths:
      - 'scripts/comer-inference-worker.mjs'
      - 'scripts/build-comer-vendor.sh'
      - '.github/workflows/build-comer-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-local-browser-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned model and compile local inference assets
        run: bash scripts/build-comer-vendor.sh
      - name: Assert isolated integration
        run: |
          python - <<'PY'
          from pathlib import Path
          beta=Path("whiteboard-comer-beta.html").read_text()
          regular=Path("whiteboard-smart-beta.html").read_text()
          assert "whiteboard-comer-bridge-beta.js" in beta
          assert "whiteboard-comer-bridge-beta.js" not in regular
          assert "whiteboard-moe-local-only-guard-v1.js" in regular
          assert "connect-src 'none'" in regular
          assert "whiteboard-moe-local-only-guard-v1.js" not in beta
          assert "connect-src 'self'" in beta
          assert Path("vendor/comer/comer-worker.js").stat().st_size > 10000
          print("Isolated CoMER Beta guard checks OK.")
          PY
      - name: Commit pinned model and local WASM worker to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/comer
          if ! git diff --cached --quiet; then
            git commit -m "Build vendored CoMER Beta assets [skip ci]"
            git push
          fi
