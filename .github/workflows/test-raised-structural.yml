name: Raised measurement structural regression
on:
  push:
    branches: [fix/superscript-structural-20261018]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-raised-measurement-structural.cjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-raised-measurement-structural.cjs
      - run: node scripts/test-raised-two-geometry.cjs
      - run: node scripts/test-reader-syntax.cjs
