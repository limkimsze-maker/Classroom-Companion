name: V2 document annotations
on:
  push:
    branches: [main, fix/v2-document-follow-20261021]
    paths:
      - whiteboard-document-open-v2-trial.js
      - whiteboard-v2-trial.html
      - experimental/math-structure/whiteboard-text-drag-resizable-v2.js
      - experimental/math-structure/beautify-v2.js
      - experimental/math-structure/test-learning-browser-v2.cjs
      - experimental/math-structure/test-document-annotations-v2.cjs
      - experimental/math-structure/fixtures/documents/**
      - .github/workflows/v2-document-annotations.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --prefix /tmp/document-browser --no-save playwright@1.62.1
          node /tmp/document-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify original implementation exposes the anchoring regression
        run: |
          if DOCUMENT_BASELINE=1 NODE_PATH=/tmp/document-browser/node_modules node experimental/math-structure/test-document-annotations-v2.cjs /tmp/document-baseline > /tmp/document-baseline.log 2>&1; then
            cat /tmp/document-baseline.log
            echo 'Expected original implementation to fail the new regression checks'
            exit 1
          fi
          cat /tmp/document-baseline.log
          grep -E 'AssertionError.*(zoom|resize|pan)' /tmp/document-baseline.log
      - name: Verify V2 document formats in desktop and phone browsers
        run: |
          node --check whiteboard-document-open-v2-trial.js
          node --check experimental/math-structure/whiteboard-text-drag-resizable-v2.js
          NODE_PATH=/tmp/document-browser/node_modules node experimental/math-structure/test-document-annotations-v2.cjs document-annotation-evidence
      - name: Preserve existing V2 handwriting, object resize and eraser flows
        run: NODE_PATH=/tmp/document-browser/node_modules node experimental/math-structure/test-shipped-browser.cjs document-annotation-evidence/handwriting
      - name: Verify current Learn and Settings export/import controls
        run: NODE_PATH=/tmp/document-browser/node_modules node experimental/math-structure/test-learning-browser-v2.cjs document-annotation-evidence/learning
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-document-annotation-evidence
          path: document-annotation-evidence/
