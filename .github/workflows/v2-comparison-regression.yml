name: V2 rough comparison regression
on:
  push:
    paths:
      - smart-math-bars-v2.js
      - smart-math-comparison-predrawn-robust3.js
      - experimental/math-structure/whiteboard-text-drag-resizable-v2.js
      - whiteboard.html
      - scripts/test-alpha-comparison-render.cjs
      - scripts/test-comparison-rough-bars.cjs
      - scripts/test-alpha-comparison-atomic.cjs
      - .github/workflows/v2-comparison-regression.yml
  workflow_dispatch:
jobs:
  comparison-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test rough comparison bars
        run: node scripts/test-comparison-rough-bars.cjs
      - name: Install DOM regression test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - name: Test Alpha and V2 comparison rendering
        run: node scripts/test-alpha-comparison-render.cjs

