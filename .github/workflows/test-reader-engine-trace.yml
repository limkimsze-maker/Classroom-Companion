name: Engine trace
on:
  push:
    branches: [fix/reader-trace-20261019]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, whiteboard-handwriting-beautify-inkon-beta.js, scripts/test-recognition-engine-trace.cjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-recognition-engine-trace.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-raised-three-reconcile.cjs
