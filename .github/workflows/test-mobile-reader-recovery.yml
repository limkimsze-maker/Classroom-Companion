name: Mobile reader recovery
on:
  push:
    branches: [fix/reader-mobile-recovery-20261018]
  pull_request:
    paths: [whiteboard-handwriting-beautify-inkon-beta.js, scripts/test-mobile-reader-recovery.cjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-mobile-reader-recovery.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-trained-remaining-58.cjs
