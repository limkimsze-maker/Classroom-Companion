name: Vendor MOE document engines

on:
  push:
    paths:
      - '.github/workflows/vendor-moe-document-engines.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor browser-only document engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/moe
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js' -o vendor/moe/mammoth.browser.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o vendor/moe/xlsx.full.min.js
          npm install --no-save --ignore-scripts @aiden0z/pptx-renderer@1.3.0
          cp node_modules/@aiden0z/pptx-renderer/dist/aiden0z-pptx-renderer.browser.es.js vendor/moe/pptx-renderer.browser.es.js
          cat > vendor/moe/README.md <<'EOF'
          # MOE-safe local document engines

          These browser bundles are pinned and served from this repository so the Classroom Companion MOE Safe Beta does not fetch third-party code at runtime.

          - Mammoth 1.8.0 — DOCX to HTML — BSD-2-Clause
          - SheetJS xlsx 0.18.5 — spreadsheet parsing — Apache-2.0
          - @aiden0z/pptx-renderer 1.3.0 browser ESM — PPTX rendering — see upstream licence

          The PowerPoint viewer is configured without optional PDF.js fallback, so it does not attempt external runtime resolution.
          EOF
      - name: Commit vendored engines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/moe
          if git diff --cached --quiet; then
            echo 'No vendor changes.'
            exit 0
          fi
          git commit -m 'Vendor MOE-safe local document engines'
          git push
