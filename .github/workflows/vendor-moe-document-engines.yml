name: Vendor MOE document engines

on:
  push:
    paths:
      - '.github/workflows/vendor-moe-document-engines.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor browser-only document engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/moe
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js' -o vendor/moe/pdf.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' -o vendor/moe/pdf.worker.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js' -o vendor/moe/mammoth.browser.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o vendor/moe/xlsx.full.min.js
          npm install --no-save --ignore-scripts @aiden0z/pptx-renderer@1.3.0
          cp node_modules/@aiden0z/pptx-renderer/dist/aiden0z-pptx-renderer.browser.es.js vendor/moe/pptx-renderer.browser.es.js
          cat > vendor/moe/README.md <<'EOF'
          # MOE-safe local document engines

          These pinned browser bundles are served from this repository so the Classroom Companion MOE Safe Beta does not fetch third-party code at runtime.

          - PDF.js 3.11.174 — PDF rendering — Apache-2.0
          - Mammoth 1.8.0 — DOCX to HTML — BSD-2-Clause
          - SheetJS xlsx 0.18.5 — spreadsheet parsing — Apache-2.0
          - @aiden0z/pptx-renderer 1.3.0 browser ESM — PPTX rendering — upstream licence

          The PowerPoint viewer is configured with pdfjs:false so optional external PDF.js fallback resolution is disabled.
          EOF
      - name: Generate local-only document viewer and review page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('whiteboard-document-open-v2.js').read_text()
          repl = {
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js": "vendor/moe/pdf.min.js",
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js": "vendor/moe/pdf.worker.min.js",
            "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js": "vendor/moe/mammoth.browser.min.js",
            "https://cdn.jsdelivr.net/npm/@aiden0z/pptx-renderer@1.3.0/+esm": "./vendor/moe/pptx-renderer.browser.es.js",
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js": "vendor/moe/xlsx.full.min.js",
          }
          for old, new in repl.items():
              if old not in src:
                  raise SystemExit(f'missing expected URL: {old}')
              src = src.replace(old, new)
          header = "/* MOE SAFE BUILD: all document engines are same-origin, pinned, and no document bytes are uploaded. */\n"
          Path('whiteboard-document-open-moe-v2.js').write_text(header + src)

          html = Path('whiteboard-smart-beta.html').read_text()
          html = html.replace(
              '<meta name="theme-color" content="#0f766e">',
              '<meta name="theme-color" content="#0f766e">\n'
              '<link rel="preload" href="vendor/moe/pdf.min.js" as="script">\n'
              '<link rel="preload" href="vendor/moe/pdf.worker.min.js" as="script">\n'
              '<link rel="preload" href="vendor/moe/mammoth.browser.min.js" as="script">\n'
              '<link rel="preload" href="vendor/moe/xlsx.full.min.js" as="script">\n'
              '<link rel="modulepreload" href="vendor/moe/pptx-renderer.browser.es.js">'
          )
          html = html.replace(
              'Local PDF/image/text only · outbound app connections blocked · production Whiteboard unchanged.',
              'Local PDF/Word/PowerPoint/Excel/media · no document upload · outbound app connections blocked.'
          )
          html = html.replace(
              '<script src="whiteboard-moe-local-only-guard-v1.js?v=20261017-moesafe1"></script>',
              '<script src="whiteboard-moe-local-only-guard-v1.js?v=20261017-moesafe2"></script>'
          )
          old = '<script src="whiteboard-document-open-moe-v1.js?v=20261017-moesafe1"></script>'
          new = '<script src="whiteboard-document-open-moe-v2.js?v=20261017-moesafe2"></script>\n<script src="whiteboard-document-gestures-v1.js?v=20261017-documentgestures5"></script>'
          if old not in html:
              raise SystemExit('expected MOE v1 document script tag not found')
          html = html.replace(old, new)
          Path('whiteboard-smart-beta.html').write_text(html)

          note = '''# Classroom Companion — MOE-safe local document review build

Date: 17 Oct 2026
Scope: `whiteboard-smart-beta.html`

## Purpose

This beta is intentionally hardened for review of the local-document workflow. Selecting a supported teaching file gives browser-side code access to that file for rendering, but the Classroom Companion application does not transmit the selected document to an upload endpoint or third-party document service.

## Supported local formats

- PDF
- Word: DOCX
- PowerPoint: PPTX, PPTM, PPSX, POTX
- Spreadsheets: XLSX, XLS, XLSM, XLSB, ODS, CSV
- Images supported by the browser
- HTML and plain-text formats
- Browser-supported audio/video formats

Legacy `.doc` and `.ppt` are not claimed as reliable in this review build.

## Review-build controls

1. **Local browser file access only**
   - Files are obtained through the browser File API.
   - PDF, Word, PowerPoint and spreadsheet bytes are passed directly to browser-side renderers as `ArrayBuffer` data.
   - Images/media and browser-native previews use local `blob:` object URLs where appropriate.
   - The review build has no document-upload endpoint.

2. **Document engines are pinned and self-hosted**
   - PDF.js 3.11.174, Mammoth 1.8.0, SheetJS xlsx 0.18.5 and @aiden0z/pptx-renderer 1.3.0 are stored under `vendor/moe/` in this repository.
   - The browser does not retrieve these engines from jsDelivr, npm or another third-party CDN at runtime.
   - PowerPoint rendering is configured with `pdfjs:false` so its optional external PDF fallback is disabled.

3. **Third-party analytics removed from the beta**
   - Counter.dev is not loaded by `whiteboard-smart-beta.html` in MOE-safe mode.

4. **Outbound application connections blocked**
   - The page Content Security Policy sets `connect-src 'none'`.
   - The local-only guard disables application calls through `fetch`, `XMLHttpRequest`, `WebSocket`, `EventSource` and `navigator.sendBeacon`.
   - Scripts, workers, images, media and frames are restricted to the same GitHub Pages origin plus browser-local `data:`/`blob:` resources as required.

5. **Document bytes are not persisted by the document viewer**
   - The viewer does not write selected document bytes to `localStorage`, IndexedDB, cookies or a backend.
   - Per-page whiteboard annotations are held in an in-memory `Map` for the current document session.
   - Local `blob:` URLs are revoked when replaced or closed.
   - Closing the browser tab releases browser-session memory.

6. **Existing teaching logic remains separate**
   - Smart Math and the frozen bar-model files are not modified by this security hardening.
   - A pre-hardening rollback snapshot exists on branch `working-baseline-frozen-2026-10-17`.

## Suggested verification for ETD

Use harmless sample files rather than protected MOE material for the technical demonstration.

1. Open Chrome DevTools → Network and clear the log after the app has finished loading.
2. Open a sample PDF, DOCX, PPTX and XLSX with **Open File**.
3. Navigate pages/slides/sheets and annotate with the whiteboard tools.
4. Confirm there is no request containing document bytes and no request to an upload/document-conversion service.
5. The document engines should resolve only from the same Classroom Companion GitHub Pages origin; there should be no jsDelivr/npm document-engine request.
6. After the page and its static app assets have loaded, disconnect the network and repeat with a local sample document. Browser-side document rendering should continue for formats whose required engine assets have already loaded/cached.
7. Inspect the page source/CSP and the `vendor/moe/` directory as independent evidence of the constrained design.

## Important policy caveat

This technical design does not override MOE DLP policy. A managed device may still classify selecting a protected file on an external-origin webpage as “FILE UPLOAD TO WEB” even when application code does not transmit the file. The purpose of this build is to give ETD a constrained implementation that can be independently reviewed and, if appropriate, considered for an approved exception or deployment route.
'''
          Path('MOE-LOCAL-DOCUMENT-SECURITY.md').write_text(note)
          PY

          if grep -Eq 'https?://' whiteboard-document-open-moe-v2.js; then
            echo 'External URL unexpectedly present in MOE document viewer.' >&2
            grep -En 'https?://' whiteboard-document-open-moe-v2.js >&2 || true
            exit 1
          fi
          if grep -Eq 'cdn\.jsdelivr|counter\.dev|registry\.npmjs' whiteboard-smart-beta.html whiteboard-document-open-moe-v2.js; then
            echo 'External runtime dependency unexpectedly present in MOE review page.' >&2
            grep -En 'cdn\.jsdelivr|counter\.dev|registry\.npmjs' whiteboard-smart-beta.html whiteboard-document-open-moe-v2.js >&2 || true
            exit 1
          fi
      - name: Commit MOE-safe multi-format build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/moe whiteboard-document-open-moe-v2.js whiteboard-smart-beta.html MOE-LOCAL-DOCUMENT-SECURITY.md
          if git diff --cached --quiet; then
            echo 'No MOE-safe changes.'
            exit 0
          fi
          git commit -m 'Enable MOE-safe local multi-format documents'
          git push
