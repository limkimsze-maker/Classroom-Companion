name: Vendor MOE document engines

on:
  push:
    paths:
      - '.github/workflows/vendor-moe-document-engines.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor browser-only document engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/moe
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js' -o vendor/moe/pdf.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' -o vendor/moe/pdf.worker.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js' -o vendor/moe/mammoth.browser.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o vendor/moe/xlsx.full.min.js
          npm install --no-save --ignore-scripts @aiden0z/pptx-renderer@1.3.0
          cp node_modules/@aiden0z/pptx-renderer/dist/aiden0z-pptx-renderer.browser.es.js vendor/moe/pptx-renderer.browser.es.js
          cat > vendor/moe/README.md <<'EOF'
          # MOE-safe local document engines

          These pinned browser bundles are served from this repository so the Classroom Companion MOE Safe Beta does not fetch third-party code at runtime.

          - PDF.js 3.11.174 — PDF rendering — Apache-2.0
          - Mammoth 1.8.0 — DOCX to HTML — BSD-2-Clause
          - SheetJS xlsx 0.18.5 — spreadsheet parsing — Apache-2.0
          - @aiden0z/pptx-renderer 1.3.0 browser ESM — PPTX rendering — upstream licence

          The PowerPoint viewer is configured with pdfjs:false so optional external PDF.js fallback resolution is disabled.
          EOF
      - name: Generate local-only document viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('whiteboard-document-open-v2.js').read_text()
          repl = {
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js": "vendor/moe/pdf.min.js",
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js": "vendor/moe/pdf.worker.min.js",
            "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js": "vendor/moe/mammoth.browser.min.js",
            "https://cdn.jsdelivr.net/npm/@aiden0z/pptx-renderer@1.3.0/+esm": "./vendor/moe/pptx-renderer.browser.es.js",
            "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js": "vendor/moe/xlsx.full.min.js",
          }
          for old, new in repl.items():
              if old not in src:
                  raise SystemExit(f'missing expected URL: {old}')
              src = src.replace(old, new)
          header = "/* MOE SAFE BUILD: all document engines are same-origin, pinned, and no document bytes are uploaded. */\n"
          Path('whiteboard-document-open-moe-v2.js').write_text(header + src)
          PY
          if grep -Eq 'https?://' whiteboard-document-open-moe-v2.js; then
            echo 'External URL unexpectedly present in MOE document viewer.' >&2
            grep -En 'https?://' whiteboard-document-open-moe-v2.js >&2 || true
            exit 1
          fi
      - name: Commit vendored engines and local viewer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/moe whiteboard-document-open-moe-v2.js
          if git diff --cached --quiet; then
            echo 'No vendor changes.'
            exit 0
          fi
          git commit -m 'Extend MOE-safe local document engines'
          git push
