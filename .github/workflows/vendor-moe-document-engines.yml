name: Vendor MOE document engines

on:
  push:
    paths:
      - '.github/workflows/vendor-moe-document-engines.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor browser-only document engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/moe
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js' -o vendor/moe/pdf.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js' -o vendor/moe/pdf.worker.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js' -o vendor/moe/mammoth.browser.min.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' -o vendor/moe/xlsx.full.min.js
          npm install --no-save --ignore-scripts @aiden0z/pptx-renderer@1.3.0
          cp node_modules/@aiden0z/pptx-renderer/dist/aiden0z-pptx-renderer.browser.es.js vendor/moe/pptx-renderer.browser.es.js
      - name: Generate and wire local-only viewer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('whiteboard-document-open-v2.js').read_text()
          replacements={
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js':'vendor/moe/pdf.min.js',
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js':'vendor/moe/pdf.worker.min.js',
          'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js':'vendor/moe/mammoth.browser.min.js',
          'https://cdn.jsdelivr.net/npm/@aiden0z/pptx-renderer@1.3.0/+esm':'./vendor/moe/pptx-renderer.browser.es.js',
          'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js':'vendor/moe/xlsx.full.min.js'}
          for old,new in replacements.items():
              if old not in src: raise SystemExit('Missing expected source URL: '+old)
              src=src.replace(old,new)
          Path('whiteboard-document-open-moe-v2.js').write_text('/* MOE SAFE BUILD: same-origin pinned document engines; no document upload endpoint. */\n'+src)
          p=Path('whiteboard-smart-beta.html')
          html=p.read_text()
          if 'vendor/moe/pdf.min.js" as="script' not in html:
              html=html.replace('<meta name="theme-color" content="#0f766e">','<meta name="theme-color" content="#0f766e">\n<link rel="preload" href="vendor/moe/pdf.min.js" as="script">\n<link rel="preload" href="vendor/moe/pdf.worker.min.js" as="script">\n<link rel="preload" href="vendor/moe/mammoth.browser.min.js" as="script">\n<link rel="preload" href="vendor/moe/xlsx.full.min.js" as="script">\n<link rel="modulepreload" href="vendor/moe/pptx-renderer.browser.es.js">')
          html=html.replace('Local PDF/image/text only · outbound app connections blocked · production Whiteboard unchanged.','Local PDF/Word/PowerPoint/Excel/media · no document upload · outbound app connections blocked.')
          html=html.replace('whiteboard-moe-local-only-guard-v1.js?v=20261017-moesafe1','whiteboard-moe-local-only-guard-v1.js?v=20261017-moesafe2')
          html=html.replace('<script src="whiteboard-document-open-moe-v1.js?v=20261017-moesafe1"></script>','<script src="whiteboard-document-open-moe-v2.js?v=20261017-moesafe2"></script>\n<script src="whiteboard-document-gestures-v1.js?v=20261017-documentgestures5"></script>')
          p.write_text(html)
          PY
          if grep -Eq 'https?://' whiteboard-document-open-moe-v2.js; then exit 1; fi
          if grep -Eq 'cdn\.jsdelivr|counter\.dev|registry\.npmjs' whiteboard-smart-beta.html whiteboard-document-open-moe-v2.js; then exit 1; fi
      - name: Commit MOE-safe multi-format build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/moe whiteboard-document-open-moe-v2.js whiteboard-smart-beta.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable MOE-safe local multi-format documents'
          git push
