name: Verify shipped V2 recovery
on:
  push:
    branches: [test/v2-live-recovery-20261021, 'fix/v2-signs-*']
    paths:
      - experimental/math-structure/**
      - .github/workflows/verify-shipped-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shipped-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact shipped scripts and reader initialization
        run: |
          mkdir -p v2-shipped-validation
          node --check experimental/math-structure/reader-v2.js
          node --check experimental/math-structure/beautify-v2.js
          node --check experimental/math-structure/symbol-learning-v2.js
          node --check experimental/math-structure/learning-controls-v2.js
          node --check experimental/math-structure/whiteboard-text-drag-resizable-v2.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),crypto=require('crypto'),assert=require('assert/strict');
          const source=fs.readFileSync('experimental/math-structure/reader-v2.js','utf8'),ctx={window:{}};
          vm.runInNewContext(source,ctx);
          assert.equal(typeof ctx.window.WhiteboardHandwritingMath.recognize,'function');
          console.log('PASS shipped reader initializes:',ctx.window.WhiteboardHandwritingMath.build);
          const files=['experimental/math-structure/reader-v2.js','experimental/math-structure/beautify-v2.js','experimental/math-structure/whiteboard-text-drag-resizable-v2.js','whiteboard-v2-trial.html'];
          fs.writeFileSync('v2-shipped-validation/source-hashes.json',JSON.stringify(Object.fromEntries(files.map(p=>[p,crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')])),null,2));
          JS
      - name: Verify division and compact equals controls
        run: node experimental/math-structure/test-signs-v2.cjs
      - name: Verify reusable symbols and portable learning with real models
        run: node experimental/math-structure/test-symbol-learning-v2.cjs
      - name: Install browser runtime
        run: |
          npm install --prefix /tmp/classroom-v2-browser --no-save playwright@1.62.1
          node /tmp/classroom-v2-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test actual shipped desktop and mobile recognition and resize flows
        run: NODE_PATH=/tmp/classroom-v2-browser/node_modules node experimental/math-structure/test-shipped-browser.cjs v2-shipped-validation/browser
      - name: Test learning, export and import on desktop and mobile
        run: NODE_PATH=/tmp/classroom-v2-browser/node_modules node experimental/math-structure/test-learning-browser-v2.cjs v2-shipped-validation/learning-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipped-v2-browser-evidence
          path: v2-shipped-validation/
  shipped-recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Point existing audits at exact shipped V2
        run: |
          mkdir -p v2-shipped-validation
          cat > /tmp/use-shipped-v2.cjs <<'JS'
          const fs=require('node:fs'),path=require('node:path');
          const root=process.cwd(),candidate=require(path.join(root,'experimental/math-structure/candidate.cjs'));
          candidate.build=()=>fs.readFileSync(path.join(root,'experimental/math-structure/reader-v2.js'),'utf8');
          JS
      - name: Shipped nested layout controls
        run: NODE_OPTIONS=--require=/tmp/use-shipped-v2.cjs node experimental/math-structure/test-structural-parser.cjs v2-shipped-validation/nested-layouts.json
      - name: Shipped existing regression suites
        if: always()
        run: NODE_OPTIONS=--require=/tmp/use-shipped-v2.cjs node experimental/math-structure/regressions.cjs v2-shipped-validation/regressions.json
      - name: Shipped identical frozen 924-case benchmark
        if: always()
        run: NODE_OPTIONS=--require=/tmp/use-shipped-v2.cjs node experimental/math-structure/paired-benchmark.cjs v2-shipped-validation/paired-report.json
      - name: Preserve the previously published V2 correct readings
        if: always()
        run: |
          git fetch --no-tags --depth=1 origin fde629487572753ce51471613997927633050ffd
          git show fde629487572753ce51471613997927633050ffd:experimental/math-structure/reader-v2.js > /tmp/previous-v2-reader.js
          node experimental/math-structure/test-v2-signs-preservation.cjs /tmp/previous-v2-reader.js v2-shipped-validation/v2-simulations.json v2-shipped-validation/previous-v2-paired.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipped-v2-recognition-evidence
          path: v2-shipped-validation/
