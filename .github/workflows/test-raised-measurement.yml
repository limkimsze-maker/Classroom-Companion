name: Raised measurement regression
on:
  push:
    branches: [fix/raised-unit-before-primary-20261018]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-raised-measurement-priority.cjs]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-raised-measurement-priority.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-trained-remaining-58.cjs
      - run: node scripts/test-equals-geometry.cjs
