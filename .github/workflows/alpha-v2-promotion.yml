name: Alpha V2 promotion
on:
  push:
    branches: [main, 'promote/v2-alpha-*']
    paths:
      - whiteboard.html
      - whiteboard-alpha-v2-bootstrap.js
      - scripts/test-alpha-startup-performance.cjs
      - scripts/test-alpha-pdf-open-performance.cjs
      - scripts/test-alpha-pdf-firstpaint.cjs
      - scripts/test-alpha-v2-promotion.cjs
      - scripts/test-alpha-annotation-actions.cjs
      - scripts/test-alpha-page-drag.cjs
      - whiteboard-document-gestures-v2-trial.js
      - whiteboard-document-open-my-documents-test.js
      - my-documents-v1.js
      - .github/workflows/alpha-v2-promotion.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check whiteboard-alpha-v2-bootstrap.js
      - run: node --check whiteboard-document-gestures-v2-trial.js
      - run: node --check whiteboard-contextual-actions-v1.js
      - run: node experimental/math-structure/test-division-grouping-v2.cjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/alpha-browser --no-save playwright@1.55.0
          node /tmp/alpha-browser/node_modules/playwright/cli.js install chromium --only-shell
      - name: Measure Alpha startup loading
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-startup-performance.cjs
      - name: Measure PDF opening and repeated PDF open
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-pdf-open-performance.cjs
      - name: Verify scanned PDF fast preview, sharpened detail and annotation stability
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-pdf-firstpaint.cjs
      - name: Verify Alpha desktop and mobile
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-v2-promotion.cjs
      - name: Verify drag-to-turn document pages and protected pen input
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-page-drag.cjs
      - name: Verify annotation save, reopen, delete and rename
        env:
          NODE_PATH: /tmp/alpha-browser/node_modules
        run: node scripts/test-alpha-annotation-actions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-v2-screenshots
          path: /tmp/alpha-v2-*.png
