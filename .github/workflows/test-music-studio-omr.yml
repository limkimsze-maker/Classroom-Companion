name: Validate live Music Score Studio OMR

on:
  push:
    paths:
      - '.github/workflows/test-music-studio-omr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chrome and upstream test driver
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome
          google-chrome --version
          curl -fsSL https://raw.githubusercontent.com/pzfreo/partsong/e7cbd9112763aa31e45abaea2d1bbe09159a8f1b/scripts/headless-test.mjs -o /tmp/headless-test.mjs
          sed -i 's|/Applications/Google Chrome.app/Contents/MacOS/Google Chrome|/usr/bin/google-chrome|' /tmp/headless-test.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/music-omr-drive.js')
          p.write_text(r'''
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const msg=document.getElementById('omrImportStatus');
          const source=await fetch('ai/samples/tallis-if-ye-love-me.pdf');
          if(!source.ok)throw Error('Test score PDF not accessible');
          const blob=await source.blob();
          const file=new File([blob],'tallis.pdf',{type:'application/pdf'});
          const transfer=new DataTransfer();
          transfer.items.add(file);
          const input=document.getElementById('omrChooseInput');
          if(!input)throw Error('Take Picture → Play input not present');
          input.files=transfer.files;
          input.dispatchEvent(new Event('change',{bubbles:true}));
          const stop=Date.now()+280000;
          while(Date.now()<stop){
             await wait(1800);
             const panel=document.getElementById('pianoPanel');
             if(panel && !panel.hidden){
               const number=+(document.getElementById('pianoCounts')?.textContent.match(/(\d+) notes/)?.[1]||0);
               window.result={ok:number>=5,notes:number,title:document.getElementById('pianoTitle')?.textContent,status:msg?.textContent,play:document.getElementById('play')?.textContent};
               break;
             }
             if(/Could not recognise|could not be reproduced|couldn't read page|reader is busy/i.test(msg?.textContent||'')){
               window.result={ok:false,error:msg?.textContent};
               break;
             }
          }
          window.result??={ok:false,error:'Timeout: trained OMR failed to complete'};
          ''')
          PY
      - name: Start local site and execute genuine trained OMR on a published sample
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/music-omr-http.log 2>&1 &
          sleep 2
          CHROME_FLAGS='--no-sandbox --disable-dev-shm-usage --autoplay-policy=no-user-gesture-required' node /tmp/headless-test.mjs 'http://localhost:8765/music-score-studio/index.html' /tmp/music-omr-result.json 330 /tmp/music-omr-drive.js
          cat /tmp/music-omr-result.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/music-omr-result.json'))
          if not r.get('ok'): raise SystemExit('Real trained OMR test failed: '+str(r))
          print(f"PASS: recognized {r['notes']} score notes, rendered and invoked playback")
          PY
