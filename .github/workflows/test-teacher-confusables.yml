name: Teacher confusable handwriting
on:
  push:
    branches: [feature/confusable-override-20261019]
  pull_request:
    paths: [whiteboard-teacher-confusables-beta.js, whiteboard-handwriting-recognition-beta.js, scripts/test-teacher-confusables.cjs]
jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-teacher-confusables.cjs
      - run: node scripts/test-teacher-units-override.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-raised-measurement-structural.cjs
