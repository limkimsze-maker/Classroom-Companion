name: Trained square cube authority
on:
  push:
    branches: [fix/trained-m2-m3-authority-20261019]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-authoritative-m2m3.cjs]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-authoritative-m2m3.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-teacher-units-override.cjs
      - run: node scripts/test-teacher-confusables.cjs
