name: Unified unit-first regression
on:
  push:
    branches: [fix/unified-unit-first-20261019]
  pull_request:
    paths: [whiteboard-handwriting-recognition-beta.js, scripts/test-unified-unit-first.cjs]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-unified-unit-first.cjs
      - run: node scripts/test-reader-syntax.cjs
      - run: node scripts/test-teacher-units-override.cjs
      - run: node scripts/test-teacher-confusables.cjs
