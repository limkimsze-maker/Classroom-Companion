name: Test trained handwriting 97
on:
  push:
    branches:
      - feature/deploy-trained-9gq-equals-20261018
  pull_request:
    paths:
      - whiteboard-trained-9gq-equals-beta.js
      - scripts/test-trained-97-handwriting.cjs
jobs:
  trained-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-trained-97-handwriting.cjs
      - run: node scripts/test-character-9gq-local.cjs
      - run: node scripts/test-equals-geometry.cjs
