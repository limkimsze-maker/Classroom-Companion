<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Segments • Regression Checks</title>
<style>body{font:15px system-ui;background:#f0f8f6;color:#17324d;max-width:950px;margin:20px auto;padding:14px}
h1{font-size:24px}.boardWrap{position:relative;background:white;border:1px solid #d1dedb;height:360px;overflow:hidden;border-radius:9px}
canvas#board{width:100%;height:100%;display:block;touch-action:none}
button{cursor:pointer}table{width:100%;border-collapse:collapse;background:white}
th,td{border-bottom:1px solid #dbe8e3;text-align:left;padding:10px}
.pass{color:#096b45;font-weight:700}.fail{color:#c32c32;font-weight:700}
#summary{font-size:18px;font-weight:800}#smartMathBtn,#undoBtn{padding:10px;margin:4px}
.btn{background:#fff;border:1px solid #9cb9b3;border-radius:8px;padding:7px}.btn.soft{background:#e6f7f0}
.btn.danger{color:#b42318}</style></head><body>
<h1>Fraction bar: segment, label, colour and bracket regression</h1>
<p>Runs tests against the actual Beta V2 segment editor, without altering Alpha or a saved whiteboard.</p>
<div><button id="smartMathBtn">✨ Smart Math</button><button id="undoBtn">↶ Undo</button>
<a href="../whiteboard-v2-trial.html">Open Beta V2</a></div>
<div id="boardWrap" class="boardWrap"><canvas id="board"></canvas></div>
<p id="summary">Preparing tests…</p>
<table><thead><tr><th>Test</th><th>Outcome</th></tr></thead><tbody id="results"></tbody></table><div id="toast"></div>
<script>
const canvas=document.getElementById('board'),undoBtn=document.getElementById('undoBtn');
let strokes=[],tool='select',cssW=1000,cssH=360;
function redraw(){} function syncUi(){} function say(){}
</script>
<script src="../smart-math-fractions-v3.js?v=20261024-fraction-controls4"></script>
<script src="../smart-math-fraction-segment-options-v1.js?v=20261024-fraction-controls4"></script>
<script src="../smart-math-fraction-transform-v1.js?v=20261024-fraction-controls4"></script>
<script>
const checks=[],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function check(name,condition,details){checks.push({name,ok:!!condition,details:details||''})}
function item(id){return strokes.find(o=>o.smartId===id)}
function value(i){return i?.value||''}
function clickButton(panel,label){const b=[...panel.querySelectorAll('button')].find(q=>q.textContent.includes(label));if(!b)throw Error('Missing button '+label);b.click()}
function makeFraction(id,horizontal=true){return {type:'image',smartType:'fractionBar',smartGenerated:true,smartId:id,x:.15,y:.32,w:horizontal?.66:.16,h:horizontal?.22:.55,fractionHorizontal:horizontal,fractionParts:4,fractionFills:['#fff','#fff','#fff','#fff'],src:'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22/%3E'}}
async function run(){
 const cmp={smartId:'comparison-protected',smartType:'barModel',smartBarType:'comparison',x:.05,y:.05,w:.3,h:.13,barCount:3};
 strokes=[cmp,makeFraction('test-frac')];const cmpSnapshot=JSON.stringify(cmp);
 redraw();await wait(100);
 check('Segment editor starts',!!window.ClassroomFractionSegmentOptions);
 check('Fraction recognizer remains active',!!window.ClassroomFractionBars&&typeof window.ClassroomFractionBars.refresh==='function');
 check('Move and resize controls initialize',!!window.ClassroomFractionTransforms);
 try{
  window.ClassroomFractionSegmentOptions.open('test-frac',1,2,400,80);
  let panel=document.getElementById('smartFractionOptionsPanel');
  const ins=panel?.querySelectorAll('input'),selects=panel?.querySelectorAll('select');
  check('Panel contains no From / To selectors or bracket label',panel&&ins.length===1&&selects.length===2&&
       !panel.textContent.includes('Bracket label')&&!panel.textContent.includes('From')&&!panel.textContent.includes('To'));
  check('Selection range comes from drag, not menus',panel?.textContent.includes('Parts 2–3 selected'));
  // Capture-style direct selection from Part 1 to Part 3, without range dropdowns.
  panel.querySelector('[aria-label="Close fraction options"]').click();await wait(100);
  const startZone=document.querySelector('[aria-label="Select fraction segment 1"]');
  if(!startZone)throw Error('Fraction segment tap zone missing');
  const rect=canvas.getBoundingClientRect(),endX=rect.left+(.15+.66*2.5/4)*rect.width;
  const gesture=(type,x)=>startZone.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:37,pointerType:'touch',button:0,clientX:x,clientY:rect.top+.43*rect.height}));
  gesture('pointerdown',rect.left+(.15+.66*.5/4)*rect.width);
  gesture('pointermove',endX);gesture('pointerup',endX);
  panel=document.getElementById('smartFractionOptionsPanel');
  check('Dragging across three segments selects Parts 1–3',panel?.textContent.includes('Parts 1–3 selected'));
  panel?.querySelector('[aria-label="Close fraction options"]')?.click();
  window.ClassroomFractionSegmentOptions.open('test-frac',1,2,400,80);
  panel=document.getElementById('smartFractionOptionsPanel');
  panel.querySelector('input').value='3 parts';panel.querySelectorAll('select')[0].value='#2563eb';clickButton(panel,'Above');
  let o=item('test-frac');
  check('Grouped colouring',o.fractionFills[1]==='#2563eb'&&o.fractionFills[2]==='#2563eb'&&o.fractionFills[0]==='#fff');
  check('Inside label by selected range',o.fractionSegmentLabels?.some(t=>t.start===1&&t.end===2&&t.text==='3 parts'));
  check('Bracket starts unlabeled',o.fractionBrackets?.some(b=>b.start===1&&b.end===2&&b.side==='top'&&b.label===''));
  await wait(110);
  const editZone=document.querySelector('[aria-label="Edit fraction bracket"]');
  if(!editZone)throw Error('Cannot find bracket editor target');
  editZone.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:9,button:0,clientX:470,clientY:190}));
  panel=document.getElementById('smartFractionOptionsPanel');
  check('Tapping bracket opens its own label editor',panel?.getAttribute('aria-label')==='Edit fraction bracket'&&!!panel.querySelector('input'));
  panel.querySelector('input').value='?';
  clickButton(panel,'Apply');
  check('Bracket label saved only by bracket editor',item('test-frac').fractionBrackets.some(b=>b.label==='?'));
  check('Comparison model unmodified',JSON.stringify(item('comparison-protected'))===cmpSnapshot);
  window.ClassroomFractionSegmentOptions.open('test-frac',0,3,410,85);
  panel=document.getElementById('smartFractionOptionsPanel');
  panel.querySelector('input').value='whole';
  let sel=panel.querySelectorAll('select');sel[0].value='#facc15';sel[1].value='all';
  clickButton(panel,'Apply colour / label');
  o=item('test-frac');
  check('Whole fraction fill and label',o.fractionFills.every(x=>x==='#facc15')&&o.fractionSegmentLabels.some(t=>t.start===0&&t.end===3&&t.text==='whole'));
  // A second vertical bar must keep segment and bracket orientation intact.
  strokes.push(makeFraction('vertical-frac',false));redraw();await wait(100);
  window.ClassroomFractionSegmentOptions.open('vertical-frac',1,3,400,100);
  panel=document.getElementById('smartFractionOptionsPanel');
  clickButton(panel,'Left');
  check('Vertical fraction can have a grouped left bracket',item('vertical-frac').fractionBrackets?.some(b=>b.start===1&&b.end===3&&b.side==='top'));
  window.ClassroomFractionSegmentOptions.select('test-frac');redraw();await wait(110);
  const controls=Object.fromEntries([...document.querySelectorAll('[data-fraction-handle]')].map(e=>[e.dataset.fractionHandle,e]));
  check('Visible distinct move / width / height / corner grips',Object.keys(controls).length===4&&
        controls.move.style.cursor==='grab'&&controls.width.style.cursor==='ew-resize'&&
        controls.height.style.cursor==='ns-resize'&&controls.both.style.cursor==='nwse-resize');
  const move=controls.move;
  const bx=400,by=165;
  const before=Object.assign({},item('test-frac'));
  const event=(name,el,cx,cy,id=16)=>el.dispatchEvent(new PointerEvent(name,{bubbles:true,cancelable:true,pointerId:id,pointerType:'mouse',button:0,clientX:cx,clientY:cy}));
  event('pointerdown',move,bx,by);event('pointermove',move,bx+50,by+18);event('pointerup',move,bx+50,by+18);
  check('Move grip changes position',item('test-frac').x>before.x&&item('test-frac').y>before.y);
  await wait(100);
  const wBefore=item('test-frac').w;
  event('pointerdown',controls.width,bx,by,17);event('pointermove',controls.width,bx+40,by,17);event('pointerup',controls.width,bx+40,by,17);
  check('Width grip changes only width',item('test-frac').w>wBefore);
  await wait(100);
  const hBefore=item('test-frac').h;
  event('pointerdown',controls.height,bx,by,18);event('pointermove',controls.height,bx,by+32,18);event('pointerup',controls.height,bx,by+32,18);
  check('Height grip changes height',item('test-frac').h>hBefore);
  check('Movement and resizing preserve labels and brackets',item('test-frac').fractionBrackets.some(b=>b.label==='?')&&item('test-frac').fractionSegmentLabels.length>=1);
  check('Comparison model protected after transforms',JSON.stringify(item('comparison-protected'))===cmpSnapshot);
 }catch(e){check('Full interaction regression',false,String(e))}
 const tbody=document.getElementById('results');tbody.textContent='';
 for(const c of checks){const tr=document.createElement('tr'),name=document.createElement('td'),status=document.createElement('td');name.textContent=c.name;status.textContent=(c.ok?'PASS':'FAIL')+(c.details?' — '+c.details:'');status.className=c.ok?'pass':'fail';tr.append(name,status);tbody.append(tr)}
 const passed=checks.filter(c=>c.ok).length;const sum=document.getElementById('summary');sum.textContent=passed+'/'+checks.length+' checks passed';sum.className=passed===checks.length?'pass':'fail';
}

window.addEventListener('load',()=>setTimeout(run,50));
</script></body></html>
