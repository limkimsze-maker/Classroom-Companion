<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fraction Segments • Regression Checks</title>
<style>body{font:15px system-ui;background:#f0f8f6;color:#17324d;max-width:950px;margin:20px auto;padding:14px}
h1{font-size:24px}.boardWrap{position:relative;background:white;border:1px solid #d1dedb;height:360px;overflow:hidden;border-radius:9px}
canvas#board{width:100%;height:100%;display:block;touch-action:none}
button{cursor:pointer}table{width:100%;border-collapse:collapse;background:white}
th,td{border-bottom:1px solid #dbe8e3;text-align:left;padding:10px}
.pass{color:#096b45;font-weight:700}.fail{color:#c32c32;font-weight:700}
#summary{font-size:18px;font-weight:800}#smartMathBtn,#undoBtn{padding:10px;margin:4px}
.btn{background:#fff;border:1px solid #9cb9b3;border-radius:8px;padding:7px}.btn.soft{background:#e6f7f0}
.btn.danger{color:#b42318}</style></head><body>
<h1>Fraction bar: segment, label, colour and bracket regression</h1>
<p>Runs tests against the actual Beta V2 segment editor, without altering Alpha or a saved whiteboard.</p>
<div><button id="smartMathBtn">✨ Smart Math</button><button id="undoBtn">↶ Undo</button>
<a href="../whiteboard-v2-trial.html">Open Beta V2</a></div>
<div id="boardWrap" class="boardWrap"><canvas id="board"></canvas></div>
<p id="summary">Preparing tests…</p>
<table><thead><tr><th>Test</th><th>Outcome</th></tr></thead><tbody id="results"></tbody></table><div id="toast"></div>
<script>
const canvas=document.getElementById('board'),undoBtn=document.getElementById('undoBtn');
let strokes=[],tool='select',cssW=1000,cssH=360;
function redraw(){} function syncUi(){} function say(){}
</script>
<script src="../smart-math-fractions-v3.js?v=20261024-fraction-segments1"></script>
<script src="../smart-math-fraction-segment-options-v1.js?v=20261024-fraction-segments2"></script>
<script>
const checks=[],wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function check(name,condition,details){checks.push({name,ok:!!condition,details:details||''})}
function item(id){return strokes.find(o=>o.smartId===id)}
function value(i){return i?.value||''}
function clickButton(panel,label){const b=[...panel.querySelectorAll('button')].find(q=>q.textContent.includes(label));if(!b)throw Error('Missing button '+label);b.click()}
function makeFraction(id,horizontal=true){return {type:'image',smartType:'fractionBar',smartGenerated:true,smartId:id,x:.15,y:.32,w:horizontal?.66:.16,h:horizontal?.22:.55,fractionHorizontal:horizontal,fractionParts:4,fractionFills:['#fff','#fff','#fff','#fff'],src:'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22/%3E'}}
async function run(){
 const cmp={smartId:'comparison-protected',smartType:'barModel',smartBarType:'comparison',x:.05,y:.05,w:.3,h:.13,barCount:3};
 strokes=[cmp,makeFraction('test-frac')];
 const cmpSnapshot=JSON.stringify(cmp);
 redraw();await wait(50);
 check('Segment editor starts',!!window.ClassroomFractionSegmentOptions);
 check('Editor and original fraction recognizer both load',!!window.ClassroomFractionBars&&typeof window.ClassroomFractionBars.refresh==='function');
 try{
  window.ClassroomFractionSegmentOptions.open('test-frac',1,2,400,80);
  let panel=document.getElementById('smartFractionOptionsPanel');
  let ins=panel?.querySelectorAll('input'),selects=panel?.querySelectorAll('select');
  if(!panel||ins?.length<2||selects?.length<4)throw Error('Missing editor inputs');
  ins[0].value='3 parts';ins[1].value='?';
  selects[2].value='#2563eb';clickButton(panel,'Above');
  let o=item('test-frac');
  check('Contiguous group is coloured',o.fractionFills[1]==='#2563eb'&&o.fractionFills[2]==='#2563eb'&&o.fractionFills[0]==='#fff'&&o.fractionFills[3]==='#fff');
  check('Inside label is stored by exact selected range',o.fractionSegmentLabels?.some(t=>t.start===1&&t.end===2&&t.text==='3 parts'));
  check('Group bracket is stored with label and above position',o.fractionBrackets?.some(t=>t.start===1&&t.end===2&&t.side==='top'&&t.label==='?'));
  check('Comparison object was not changed',JSON.stringify(item('comparison-protected'))===cmpSnapshot);
  undoBtn.click();await wait(50);o=item('test-frac');
  check('Undo restores labels, colour and brackets',o&&!o.fractionBrackets&&!o.fractionSegmentLabels&&o.fractionFills?.every(x=>x==='#fff'));
  window.ClassroomFractionSegmentOptions.open('test-frac',0,3,400,80);
  panel=document.getElementById('smartFractionOptionsPanel');
  panel.querySelectorAll('input')[0].value='One whole';
  const ss=panel.querySelectorAll('select');ss[2].value='#facc15';ss[3].value='all';
  clickButton(panel,'Apply colour / label');
  o=item('test-frac');
  check('Whole-bar colour and label apply without automatic bracket',
    o.fractionFills.every(x=>x==='#facc15')&&o.fractionSegmentLabels.some(t=>t.start===0&&t.end===3&&t.text==='One whole')&&(!o.fractionBrackets||o.fractionBrackets.length===0));
  strokes.push(makeFraction('vertical-frac',false));redraw();await wait(50);
  window.ClassroomFractionSegmentOptions.open('vertical-frac',1,3,420,80);
  panel=document.getElementById('smartFractionOptionsPanel');
  panel.querySelectorAll('input')[1].value='vertical total';
  clickButton(panel,'Left');
  const v=item('vertical-frac');
  check('Vertical bars support left-side bracket and span',v.fractionBrackets?.some(t=>t.start===1&&t.end===3&&t.side==='top'&&t.label==='vertical total'));
  check('Comparison object remains frozen',JSON.stringify(item('comparison-protected'))===cmpSnapshot);
 }catch(e){check('UI integration',false,String(e))}
 const tbody=document.getElementById('results');tbody.textContent='';
 for(const c of checks){const tr=document.createElement('tr'),name=document.createElement('td'),status=document.createElement('td');name.textContent=c.name;status.textContent=(c.ok?'PASS':'FAIL')+(c.details?' — '+c.details:'');status.className=c.ok?'pass':'fail';tr.append(name,status);tbody.append(tr)}
 const passed=checks.filter(c=>c.ok).length;const sum=document.getElementById('summary');sum.textContent=passed+'/'+checks.length+' checks passed';sum.className=passed===checks.length?'pass':'fail';
}
window.addEventListener('load',()=>setTimeout(run,50));
</script></body></html>
