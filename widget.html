<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Classroom Companion Strip</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--ink:#17202a;--muted:#667085;--line:#d8e1e8;--bg:#f6f8fb}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,select,input{font:inherit}.wrap{padding:3px;width:max-content;max-width:calc(100vw - 2px)}.strip{height:50px;width:max-content;max-width:900px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 4px 12px rgba(18,32,46,.07);display:flex;align-items:center;gap:4px;padding:4px 5px;white-space:nowrap;overflow:hidden}.brand{display:flex;align-items:center;gap:4px;font-weight:950;font-size:11px;padding-right:3px;flex:0 0 auto}.mark{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:13px}.customise{height:34px;border:2px solid var(--teal);background:var(--teal2);color:#0b5b55;border-radius:8px;padding:0 8px;font-weight:950;font-size:10.5px;cursor:pointer;flex:0 0 auto}.cluster,.timer-box{display:flex;align-items:center;gap:4px;flex:0 0 auto}.class-select{width:92px;height:28px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 5px;font-weight:800;font-size:12px}.btn{height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 7px;font-weight:900;color:var(--ink);cursor:pointer;font-size:12px}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.music-on{background:var(--teal2);border-color:#8ed5cb;color:#0b5b55}.timer-box{padding-left:4px;border-left:1px solid var(--line)}.time{font-size:20px;line-height:1;font-weight:950;color:var(--teal);letter-spacing:-.04em;min-width:58px;text-align:center;cursor:pointer}.tool{height:34px;min-width:61px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 5px;display:grid;grid-template-columns:16px auto;grid-template-rows:1fr 1fr;column-gap:3px;align-items:center;text-align:left;cursor:pointer;flex:0 0 auto}.tool .ico{grid-row:1/3;font-size:15px}.tool .lab{font-size:9.5px;line-height:1;font-weight:900;align-self:end}.tool .val{font-size:9px;line-height:1;color:var(--teal);font-weight:950;align-self:start;max-width:68px;overflow:hidden;text-overflow:ellipsis}.tool.more{min-width:68px}#pickBtn{min-width:116px}#pickVal{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.shortcut-track{display:flex;align-items:center;gap:4px;max-width:420px;overflow-x:auto;scrollbar-width:none;flex:0 1 auto}.shortcut-track::-webkit-scrollbar,.quick-scroll::-webkit-scrollbar{display:none}.shortcut{height:34px;max-width:112px;border:1px solid #cfd9df;background:#fff;border-radius:8px;padding:0 6px;font-size:9.5px;font-weight:900;display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap;flex:0 0 auto}.shortcut span:last-child{overflow:hidden;text-overflow:ellipsis}.quickbar{display:none;margin-top:4px;min-height:42px;max-width:900px;border:1px solid #b8d8d3;background:#fff;border-radius:10px;box-shadow:0 8px 20px rgba(18,32,46,.12);padding:4px 5px;align-items:center;gap:5px}.quickbar.show{display:flex}.quick-title{font-size:10px;font-weight:950;color:#0b5b55;padding:0 4px;flex:0 0 auto}.quick-scroll{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:790px}.quick-chip{height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 9px;font-size:10.5px;font-weight:900;cursor:pointer;white-space:nowrap;flex:0 0 auto}.quick-chip.active{background:var(--teal2);border-color:#85cfc4;color:#0b5b55}.quick-chip.primary{background:var(--teal);border-color:var(--teal);color:#fff}.quick-value{font-size:13px;font-weight:950;color:var(--ink);padding:0 8px;white-space:normal;max-width:620px}.quick-close{margin-left:auto;width:28px;height:28px;border:0;background:#eef2f5;border-radius:8px;cursor:pointer;font-weight:950}.toast{position:fixed;left:50%;bottom:3px;transform:translateX(-50%) translateY(8px);background:#17202a;color:#fff;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;opacity:0;pointer-events:none;transition:.15s;z-index:5}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="strip" id="strip">
  <div class="brand" title="Classroom Companion"><span class="mark">✦</span><span>Companion</span></div>
  <button class="customise" id="customiseBtn" type="button">☑ Tools</button>
  <div class="cluster" id="classTools"><select id="classSelect" class="class-select" aria-label="Choose class"><option value="">No class</option></select><button id="classBtn" class="btn" type="button">Class</button></div>
  <div class="timer-box" id="timerTools"><div class="time" id="time" title="Tap to start/pause • Long-press for all timer options">05:00</div><button id="timerStart" class="btn primary" type="button" title="Tap to start/pause • Long-press for options">Start</button><button id="timerReset" class="btn" type="button">Reset</button><button id="timerMusic" class="btn music-on" type="button" title="Music preference">♫ On</button></div>
  <button class="tool" id="pointBtn" type="button"><span class="ico">⭐</span><span class="lab">Point</span><span class="val" id="pointVal">0</span></button>
  <button class="tool" id="pickBtn" type="button"><span class="ico">🎯</span><span class="lab">Pick pupil</span><span class="val" id="pickVal">Ready</span></button>
  <button class="tool" id="questionBtn" type="button"><span class="ico">❓</span><span class="lab">Question</span><span class="val" id="questionVal">Why?</span></button>
  <button class="tool" id="noiseBtn" type="button"><span class="ico">🔊</span><span class="lab">Noise</span><span class="val" id="noiseVal">Silent</span></button>
  <div class="shortcut-track" id="shortcutTrack" aria-label="Pinned All Tools shortcuts"></div>
  <button class="tool more" id="moreBtn" type="button"><span class="ico">•••</span><span class="lab">All Tools</span><span class="val">Open</span></button>
</div>
<div class="quickbar" id="quickbar"><span class="quick-title" id="quickTitle">Options</span><div class="quick-scroll" id="quickScroll"></div><button class="quick-close" id="quickClose" type="button">×</button></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="ambient-engine.js?v=20261003i"></script>
<script>
'use strict';
try{window.opener=null}catch(e){}
const STORE='classroomCompanionV1',PREF_STORE='classroomCompanionStripPrefsV5',MAX_TOOLS=5;
const defaults={classes:{},selectedClass:'',classPoints:{},pupilPoints:{},teamPoints:{},timetables:{},kwl:{k:'',w:'',l:''}};
const defaultDirect={class:false,timer:true,point:false,pick:true,question:true,noise:true,more:true};
const directIds={class:'classTools',timer:'timerTools',point:'pointBtn',pick:'pickBtn',question:'questionBtn',noise:'noiseBtn',more:'moreBtn'};
const directEquivalentTitles=new Set(['Timer + Calm Music','Noise Level','Question Spinner','Pick a Pupil']);
const allTools=[
['⏱️','Timer + Calm Music'],['🧭','Lesson Stages'],['⏳','Transition Countdown'],['👀','Attention Signal'],['🎯','Focus Intervals'],['🤸','Movement Break'],['🌿','Calm / Reset'],['🕘','Full-Screen Clock'],['📅','Date & Day'],['🔊','Noise Level'],['🚦','Class Traffic Light'],['🧩','Work Mode'],['💬','Think–Pair–Share'],['🖊️','Mini-Whiteboard Routine'],['✅','Behaviour Expectations'],['🛎️','Pre-Correction'],['🆘','Help Before Teacher'],['🚀','Early Finisher'],['🧠','Brain Break'],['❓','Question Spinner'],['🅰️','Answer Check'],['📈','Confidence Check'],['🙋','Participation Counter'],['📊','Engagement Snapshot'],['🧠','KWL Chart'],['💭','Reflect'],['🖐️','End-of-Lesson Self-Check'],['✨','Quote of the Day'],['🏁','Whole-Class Goal'],['⭐','Rewards'],['🎵','Soundboard'],['📝','Observation Counter'],['🪟','Screen Shade'],['🔢','Random Number'],['🎲','Dice'],['🪙','Coin Toss'],['🧭','Action Spinner'],['🎯','Pick a Pupil'],['👥','Make Groups'],['🗓️','Daily Visual Timetable'],['📆','Weekly Visual Timetable']
].map(([icon,title])=>({icon,title,slug:slugify(title)}));
const pinTools=allTools.filter(t=>!directEquivalentTitles.has(t.title));
let data=loadData(),prefs=loadPrefs(),pickerPool=[],fullWin=null,fullWatch=null,configWin=null;
let timer={mode:'countdown',sec:300,base:300,running:false,id:null,music:true};
let questionPrompts=['Who?','What?','When?','Where?','Why?','How?','Explain','Compare','Predict','What if…?','What evidence?','Give a reason','How do you know?','Describe'];
let noiseLevels=['Silent','Whisper','Partner','Group','Presentation'],noiseIndex=0;
let stageIndex=-1,trafficIndex=-1,workIndex=-1,whiteboardIndex=-1,engagementIndex=-1,participation=0,goal=0;
const stages=['Start','Learn','Practise','Check','Reflect'],traffic=['Green','Amber','Red'],workModes=['Independent','Pair','Group','Teacher'],whiteboard=['Think','Write','Show'],engagement=['High','Medium','Low'];
const brainBreaks=['10 shoulder rolls','Reach high, then touch toes','Stand and stretch for 20 seconds','5 slow star jumps','Shake out hands and legs','March quietly on the spot'];
const earlyFinishers=['Check your work','Improve one answer','Explain your thinking to a partner','Try a harder example','Find and fix one possible mistake'];
const reflectPrompts=['What did you learn?','What was difficult?','What helped you?','What are you more confident about now?'];
const actionPrompts=['Turn left','Turn right','Clap twice','Touch your shoulders','Stand tall','Take one step back'];
const quotes=['Small steps still move you forward.','Mistakes are information you can use.','Focus on the next useful step.','Effort grows when you keep trying.','Kindness helps everyone learn.'];
const expectations=['Listen','Start promptly','Stay on task','Use the correct voice level'];
const preCorrections=['Independent work: start quietly and stay on task','Pair work: take turns and use partner voices','Group work: everyone participates','Transition: move safely and be ready quickly'];
const $=s=>document.querySelector(s);
function slugify(s){return String(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function loadData(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){return structuredClone(defaults)}}
function enforceLimit(p){let left=MAX_TOOLS;const order=['timer','pick','question','noise','more','class','point'];const direct={};for(const k of order){direct[k]=!!p.direct[k]&&left>0;if(direct[k])left--}const pins=[];for(const slug of(p.pins||[])){if(left<=0)break;if(pinTools.some(t=>t.slug===slug)&&!pins.includes(slug)){pins.push(slug);left--}}return{direct,pins}}
function loadPrefs(){try{const p=JSON.parse(localStorage.getItem(PREF_STORE)||'{}');return enforceLimit({direct:{...defaultDirect,...(p.direct||{})},pins:Array.isArray(p.pins)?p.pins:[]})}catch(e){return{direct:{...defaultDirect},pins:[]}}}
function saveData(){localStorage.setItem(STORE,JSON.stringify(data))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove('show'),1500)}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}
function format(s){s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function classKey(){return data.selectedClass||'_general'}
function currentClass(){return data.classes[data.selectedClass]||null}
function setMusicButton(){const b=$('#timerMusic');b.textContent=timer.music?'♫ On':'♫ Off';b.classList.toggle('music-on',timer.music)}
async function syncMusic(){if(timer.running&&timer.music){await window.ClassroomAmbient?.start()}else window.ClassroomAmbient?.stop(.65);setMusicButton()}
function renderTimer(){$('#time').textContent=format(timer.sec);$('#timerStart').textContent=timer.running?'Pause':'Start'}
function stopTimer(){clearInterval(timer.id);timer.id=null;timer.running=false;window.ClassroomAmbient?.stop(.65);renderTimer()}
async function startTimer(){if(timer.running){stopTimer();return}timer.running=true;renderTimer();await syncMusic();clearInterval(timer.id);timer.id=setInterval(()=>{if(timer.mode==='stopwatch')timer.sec++;else timer.sec--;renderTimer();if(timer.mode==='countdown'&&timer.sec<=0){clearInterval(timer.id);timer.id=null;timer.running=false;window.ClassroomAmbient?.stop(.7);renderTimer();toast('Time is up')}},1000)}
async function startPreset(sec,music=timer.music){clearInterval(timer.id);timer.mode='countdown';timer.base=sec;timer.sec=sec;timer.music=music;timer.running=false;setMusicButton();renderTimer();closeQuick();await startTimer()}
async function startStopwatch(music=timer.music){clearInterval(timer.id);timer.mode='stopwatch';timer.base=0;timer.sec=0;timer.music=music;timer.running=false;setMusicButton();renderTimer();closeQuick();await startTimer()}
function resetTimer(){clearInterval(timer.id);timer.id=null;timer.running=false;timer.sec=timer.mode==='stopwatch'?0:timer.base;window.ClassroomAmbient?.stop(.65);renderTimer()}
function fitStrip(){cancelAnimationFrame(fitStrip._raf);fitStrip._raf=requestAnimationFrame(()=>{try{const wrap=$('#wrap');if(!wrap)return;const rect=wrap.getBoundingClientRect();const maxInnerW=Math.max(430,(screen.availWidth||1200)-40);const w=Math.min(maxInnerW,Math.max(430,Math.ceil(rect.width+2))),h=Math.max(56,Math.ceil(rect.height+2));const dx=w-window.innerWidth,dy=h-window.innerHeight;if(Math.abs(dx)>1||Math.abs(dy)>1)window.resizeBy(dx,dy)}catch(e){}})}
function restoreStrip(){fitStrip();try{window.focus()}catch(e){}setTimeout(()=>{try{window.focus()}catch(e){};fitStrip()},80)}
function closeQuick(){$('#quickbar').classList.remove('show');$('#quickScroll').innerHTML='';fitStrip()}
function showQuick(title,items){const bar=$('#quickbar'),scroll=$('#quickScroll');$('#quickTitle').textContent=title;scroll.innerHTML='';for(const item of items){if(item.type==='value'){const v=document.createElement('div');v.className='quick-value';v.textContent=item.label;scroll.appendChild(v);continue}const b=document.createElement('button');b.type='button';b.className='quick-chip'+(item.active?' active':'')+(item.primary?' primary':'');b.textContent=item.label;b.onclick=async()=>{await item.action?.(b)};scroll.appendChild(b)}bar.classList.add('show');fitStrip();setTimeout(()=>scroll.scrollLeft=0,0)}
$('#quickClose').onclick=closeQuick;
function bindLongPress(el,fn){if(!el)return;let id=null,sx=0,sy=0;el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;sx=e.clientX;sy=e.clientY;clearTimeout(id);id=setTimeout(()=>{el._suppressClick=true;fn(e)},520)});el.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(id)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(id)));el.addEventListener('click',e=>{if(el._suppressClick){el._suppressClick=false;e.preventDefault();e.stopImmediatePropagation()}},true);el.addEventListener('contextmenu',e=>e.preventDefault())}
function timerOptions(){showQuick('Timer',[{label:'♫ Music',active:timer.music,action:async()=>{timer.music=true;setMusicButton();if(timer.running)await syncMusic();timerOptions()}},{label:'🔇 No music',active:!timer.music,action:async()=>{timer.music=false;setMusicButton();if(timer.running)await syncMusic();timerOptions()}},...([1,3,5,10,15,20,30].map(m=>({label:`${m} min`,action:()=>startPreset(m*60,timer.music)}))),{label:'Custom',action:()=>{const v=prompt('Timer length in minutes:','5');const n=Number(v);if(Number.isFinite(n)&&n>0)startPreset(Math.round(n*60),timer.music)}},{label:'Stopwatch',action:()=>startStopwatch(timer.music)},{label:timer.running?'Pause':'Start',primary:true,action:()=>{closeQuick();startTimer()}},{label:'Reset',action:()=>{resetTimer();closeQuick()}}])}
function openConfig(panel){if(configWin&&!configWin.closed){configWin.focus();return}configWin=window.open(`configure.html?panel=${panel}`,'ClassroomCompanionConfigure','popup=yes,width=620,height=720,resizable=yes,scrollbars=yes');if(!configWin){toast('Allow popups to open setup');return}configWin.focus()}
function watchFull(){clearInterval(fullWatch);fullWatch=setInterval(()=>{if(!fullWin||fullWin.closed){clearInterval(fullWatch);fullWatch=null;fullWin=null;restoreStrip();toast('Back to strip')}},250)}
function openFullTool(slug=''){if(fullWin&&!fullWin.closed){try{fullWin.postMessage({type:'classroom-companion-focus-tool',slug},location.origin);fullWin.focus();return}catch(e){}}const url=slug?`full.html?focus=${encodeURIComponent(slug)}`:'full.html';fullWin=window.open(url,'ClassroomCompanionFull','popup=yes,width=1200,height=800,resizable=yes,scrollbars=yes');if(!fullWin){toast('Allow popups to open All Tools');return}fullWin.focus();watchFull()}
function applyPrefs(){Object.entries(directIds).forEach(([key,id])=>{const el=document.getElementById(id);if(el)el.style.display=prefs.direct[key]?'':'none'});renderPins();setTimeout(fitStrip,30)}
function renderPins(){const track=$('#shortcutTrack');track.innerHTML='';for(const slug of prefs.pins){const t=pinTools.find(x=>x.slug===slug);if(!t)continue;const b=document.createElement('button');b.className='shortcut';b.type='button';b.title='Tap: use now • Long-press: choices';b.dataset.slug=t.slug;b.innerHTML=`<span>${t.icon}</span><span>${escapeHtml(t.title)}</span>`;b.onclick=()=>instantTool(t);bindLongPress(b,()=>toolOptions(t));track.appendChild(b)}track.style.display=prefs.pins.length?'flex':'none'}
function renderClasses(){const sel=$('#classSelect');sel.innerHTML='<option value="">No class</option>'+Object.keys(data.classes).map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');sel.value=data.selectedClass||'';renderPoints();resetPicker();fitStrip()}
function renderPoints(){$('#pointVal').textContent=data.classPoints[classKey()]||0}
function addPoint(reason='Point'){const k=classKey();data.classPoints[k]=(data.classPoints[k]||0)+1;saveData();renderPoints();toast(`+1 ${reason}`)}
function resetPicker(){const c=currentClass();pickerPool=c?[...c.names]:[];$('#pickVal').textContent=c?'Ready':'Add class';$('#pickBtn').title=c?'Tap to pick • Long-press for options':'Add or select a class first'}
function pickPupil(){const c=currentClass();if(!c||!c.names.length){openConfig('class');toast('Add or select a class first');return}if(!pickerPool.length)pickerPool=[...c.names];const i=Math.floor(Math.random()*pickerPool.length),name=pickerPool.splice(i,1)[0];$('#pickVal').textContent=name;$('#pickBtn').title=name;toast(name);fitStrip()}
function randomQuestion(){let n=0;const id=setInterval(()=>{$('#questionVal').textContent=questionPrompts[Math.floor(Math.random()*questionPrompts.length)];if(++n>7){clearInterval(id);fitStrip()}},55)}
function chooseNoise(v){noiseIndex=noiseLevels.indexOf(v);$('#noiseVal').textContent=v;toast(v);fitStrip()}
function cycleNoise(){noiseIndex=(noiseIndex+1)%noiseLevels.length;chooseNoise(noiseLevels[noiseIndex])}
function softTone(type='chime'){try{const AC=window.AudioContext||window.webkitAudioContext,c=new AC(),g=c.createGain(),o=c.createOscillator();o.connect(g);g.connect(c.destination);const now=c.currentTime;const map={chime:[660,.5],success:[880,.35],transition:[440,.28],applause:[520,.18]};const[f,d]=map[type]||map.chime;o.frequency.value=f;o.type=type==='transition'?'triangle':'sine';g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.start(now);o.stop(now+d+.03)}catch(e){}}
function showValue(title,value){showQuick(title,[{type:'value',label:value}])}
function groupsOf(size){const c=currentClass();if(!c||!c.names.length){openConfig('class');toast('Add or select a class first');return}const names=[...c.names].sort(()=>Math.random()-.5),groups=[];for(let i=0;i<names.length;i+=size)groups.push(names.slice(i,i+size));showValue(`Groups of ${size}`,groups.map((g,i)=>`${i+1}: ${g.join(', ')}`).join('   •   '))}
function randomInt(max){return Math.floor(Math.random()*max)+1}
function instantTool(t){const s=t.slug;switch(s){case'lesson-stages':stageIndex=(stageIndex+1)%stages.length;showValue('Lesson stage',stages[stageIndex]);break;case'transition-countdown':startPreset(60,false);toast('1-minute transition');break;case'attention-signal':softTone('chime');showValue('Attention','3… 2… 1… Eyes here');break;case'focus-intervals':startPreset(8*60,true);toast('8-minute focus');break;case'movement-break':startPreset(60,false);toast('1-minute movement break');break;case'calm-reset':startPreset(30,true);toast('30-second calm reset');break;case'full-screen-clock':showValue('Clock',new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));break;case'date-day':showValue('Today',new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'}));break;case'class-traffic-light':trafficIndex=(trafficIndex+1)%traffic.length;showValue('Traffic light',traffic[trafficIndex]);break;case'work-mode':workIndex=(workIndex+1)%workModes.length;showValue('Work mode',workModes[workIndex]);break;case'think-pair-share':showValue('Think–Pair–Share','Think → Pair → Share');break;case'mini-whiteboard-routine':whiteboardIndex=(whiteboardIndex+1)%whiteboard.length;showValue('Mini-whiteboard',whiteboard[whiteboardIndex]);break;case'behaviour-expectations':showValue('Expectation',expectations[0]);break;case'pre-correction':showValue('Pre-correction',preCorrections[0]);break;case'help-before-teacher':showValue('Before asking teacher','Try → Check → Ask a friend → Ask teacher');break;case'early-finisher':showValue('Early finisher',earlyFinishers[Math.floor(Math.random()*earlyFinishers.length)]);break;case'brain-break':showValue('Brain break',brainBreaks[Math.floor(Math.random()*brainBreaks.length)]);break;case'answer-check':showValue('Quick check','A   B   C   D');break;case'confidence-check':showValue('Confidence','1 Confused   2   3   4   5 Confident');break;case'participation-counter':participation++;showValue('Participation',String(participation));break;case'engagement-snapshot':engagementIndex=(engagementIndex+1)%engagement.length;showValue('Engagement',engagement[engagementIndex]);break;case'reflect':showValue('Reflect',reflectPrompts[Math.floor(Math.random()*reflectPrompts.length)]);break;case'end-of-lesson-self-check':showValue('Self-check','1 = confused   2   3   4   5 = confident');break;case'quote-of-the-day':showValue('Quote',quotes[Math.floor(Math.random()*quotes.length)]);break;case'whole-class-goal':goal++;showValue('Class goal',String(goal));break;case'rewards':addPoint('reward');break;case'soundboard':softTone('chime');toast('Chime');break;case'observation-counter':showValue('Observation','+1 Off task');break;case'random-number':showValue('Random number',String(randomInt(10)));break;case'dice':showValue('Dice',String(randomInt(6)));break;case'coin-toss':showValue('Coin toss',Math.random()<.5?'Heads':'Tails');break;case'action-spinner':showValue('Action',actionPrompts[Math.floor(Math.random()*actionPrompts.length)]);break;case'make-groups':groupsOf(4);break;case'kwl-chart':case'screen-shade':case'daily-visual-timetable':case'weekly-visual-timetable':openFullTool(s);break;default:openFullTool(s)}}
function toolOptions(t){const s=t.slug;const choose=(title,arr,fn)=>showQuick(title,arr.map(x=>({label:x,action:()=>{closeQuick();fn(x)}})));switch(s){case'lesson-stages':choose('Lesson stage',stages,x=>showValue('Lesson stage',x));break;case'transition-countdown':showQuick('Transition',[{label:'30 sec',action:()=>startPreset(30,false)},{label:'1 min',action:()=>startPreset(60,false)},{label:'2 min',action:()=>startPreset(120,false)}]);break;case'focus-intervals':showQuick('Focus',[{label:'5 min',action:()=>startPreset(300,true)},{label:'8 min',action:()=>startPreset(480,true)},{label:'10 min',action:()=>startPreset(600,true)},{label:'15 min',action:()=>startPreset(900,true)}]);break;case'movement-break':showQuick('Movement',[{label:'30 sec',action:()=>startPreset(30,false)},{label:'1 min',action:()=>startPreset(60,false)},{label:'2 min',action:()=>startPreset(120,false)}]);break;case'calm-reset':showQuick('Calm',[{label:'30 sec ♫',action:()=>startPreset(30,true)},{label:'1 min ♫',action:()=>startPreset(60,true)},{label:'2 min ♫',action:()=>startPreset(120,true)},{label:'5 min ♫',action:()=>startPreset(300,true)},{label:'Music until stopped',action:async()=>{clearInterval(timer.id);timer.id=null;timer.running=false;timer.music=true;setMusicButton();await window.ClassroomAmbient?.start();closeQuick();toast('Calm music on')}}]);break;case'class-traffic-light':choose('Traffic light',traffic,x=>showValue('Traffic light',x));break;case'work-mode':choose('Work mode',workModes,x=>showValue('Work mode',x));break;case'mini-whiteboard-routine':choose('Mini-whiteboard',whiteboard,x=>showValue('Mini-whiteboard',x));break;case'behaviour-expectations':choose('Expectation',expectations,x=>showValue('Expectation',x));break;case'pre-correction':choose('Pre-correction',preCorrections,x=>showValue('Pre-correction',x));break;case'early-finisher':choose('Early finisher',earlyFinishers,x=>showValue('Early finisher',x));break;case'brain-break':choose('Brain break',brainBreaks,x=>showValue('Brain break',x));break;case'answer-check':choose('Quick check',['A B C D','True / False','Thumbs up / sideways / down','Confidence 1–5'],x=>showValue('Quick check',x));break;case'confidence-check':choose('Confidence',['Need help','Getting there','I can do it','I can teach it','1–5 fingers'],x=>showValue('Confidence',x));break;case'engagement-snapshot':choose('Engagement',engagement,x=>showValue('Engagement',x));break;case'reflect':choose('Reflect',reflectPrompts,x=>showValue('Reflect',x));break;case'soundboard':choose('Sound',['Chime','Success','Transition','Applause'],x=>{softTone(x.toLowerCase());toast(x)});break;case'random-number':choose('Random range',['1–6','1–10','1–20','1–100'],x=>{const max=Number(x.split('–')[1]);showValue('Random number',String(randomInt(max)))});break;case'dice':showQuick('Dice',[{label:'1 die',action:()=>showValue('Dice',String(randomInt(6)))},{label:'2 dice',action:()=>showValue('Dice',`${randomInt(6)} + ${randomInt(6)}`)}]);break;case'make-groups':showQuick('Group size',[2,3,4,5].map(n=>({label:String(n),action:()=>groupsOf(n)})));break;default:instantTool(t)}}
$('#timerStart').onclick=startTimer;$('#time').onclick=startTimer;$('#timerReset').onclick=resetTimer;$('#timerMusic').onclick=async()=>{timer.music=!timer.music;setMusicButton();await syncMusic();toast(timer.music?'Music enabled':'No music')};
bindLongPress($('#timerStart'),timerOptions);bindLongPress($('#time'),timerOptions);
$('#pointBtn').onclick=()=>addPoint();bindLongPress($('#pointBtn'),()=>showQuick('Reward',[...['Focus','Effort','Kindness','Teamwork','Ready','Helpful','Perseverance','Responsible','Improved'].map(x=>({label:x,action:()=>{addPoint(x);closeQuick()}})),{label:'Reset points',action:()=>{data.classPoints[classKey()]=0;saveData();renderPoints();closeQuick()}}]));
$('#pickBtn').onclick=pickPupil;bindLongPress($('#pickBtn'),()=>showQuick('Pick pupil',[{label:'Pick now',primary:true,action:()=>{closeQuick();pickPupil()}},{label:'New round',action:()=>{resetPicker();closeQuick();toast('Picker reset')}},{label:'Manage class',action:()=>{closeQuick();openConfig('class')}}]));
$('#questionBtn').onclick=randomQuestion;bindLongPress($('#questionBtn'),()=>showQuick('Question',questionPrompts.map(x=>({label:x,action:()=>{$('#questionVal').textContent=x;closeQuick();fitStrip()}}))));
$('#noiseBtn').onclick=cycleNoise;bindLongPress($('#noiseBtn'),()=>showQuick('Noise level',noiseLevels.map(x=>({label:x,active:$('#noiseVal').textContent===x,action:()=>{chooseNoise(x);closeQuick()}}))));
$('#moreBtn').onclick=()=>openFullTool('');$('#customiseBtn').onclick=()=>openConfig('tools');$('#classBtn').onclick=()=>openConfig('class');
$('#classSelect').onchange=e=>{data.selectedClass=e.target.value;saveData();renderClasses()};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='classroom-companion-return-to-strip'){if(fullWatch){clearInterval(fullWatch);fullWatch=null}fullWin=null;restoreStrip()}if(e.data?.type==='classroom-companion-prefs-updated'){prefs=loadPrefs();applyPrefs();configWin=null;toast('Strip updated')}if(e.data?.type==='classroom-companion-data-updated'){data=loadData();renderClasses();configWin=null;toast('Class updated')}});
window.addEventListener('storage',e=>{if(e.key===STORE){data=loadData();renderClasses()}if(e.key===PREF_STORE){prefs=loadPrefs();applyPrefs()}});
window.addEventListener('beforeunload',()=>window.ClassroomAmbient?.stop(.1));
if('ResizeObserver'in window)new ResizeObserver(()=>fitStrip()).observe($('#wrap'));
setMusicButton();renderTimer();renderClasses();applyPrefs();
window.addEventListener('load',()=>{fitStrip();setTimeout(fitStrip,120);setTimeout(fitStrip,320)});
</script>
</body>
</html>
