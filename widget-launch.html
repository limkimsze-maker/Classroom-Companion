<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Classroom Companion Toolbar</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui}.boot{position:fixed;left:6px;top:6px;width:50px;height:50px;border:2px solid #0f766e;border-radius:15px;background:#0f766e;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:1000;box-shadow:0 8px 22px rgba(15,118,110,.28)}</style>
<script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>
</head>
<body><div class="boot" aria-label="Opening Classroom Companion toolbar">✦</div>
<script>
(async()=>{try{const r=await fetch('widget.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('widget');let html=await r.text();const cloak=`html,body{background:transparent!important;overflow:hidden!important}#strip{display:none!important}`;html=html.replace('</style>',cloak+'</style>');html=html.replace('</body>','<script id="compactWidgetPatch" src="compact-widget.js?v=20261005toolbar4"><\/script><script id="toolbarInlineNames" src="toolbar-inline-names.js?v=20261004inline2"><\/script><script id="toolbarDesktopPalette" src="toolbar-desktop-palette.js?v=20261004credit1"><\/script><script id="toolbarLanguageSwitcher" src="toolbar-language-switcher.js?v=20261005lang1"><\/script><script id="miniPipLayer" src="mini-pip.js?v=20261005pip1"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="boot" aria-label="Classroom Companion could not open">!</div>';console.error(e)}})();
</script>
</body>
</html>
