<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Reward Points • Classroom Companion</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--ink:#17202a;--muted:#667085;--line:#d8e1e8;--gold:#f59e0b;--red:#b42318;--shadow:0 18px 55px rgba(18,32,46,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 8%,#fff 0,#f2f8f7 35%,#e8f0f3 100%)}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;padding:16px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;max-width:1380px;width:100%;margin:0 auto 14px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:22px;padding:11px 13px;box-shadow:0 10px 30px rgba(18,32,46,.08);position:relative;z-index:5}.toolIcon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#fff7d6,#fff0a6);font-size:28px}.meta{min-width:0;flex:1}.title{font-size:20px;font-weight:1000;color:var(--navy);letter-spacing:-.02em}.hint{font-size:12px;color:var(--muted);font-weight:750;margin-top:3px}.topActions,.toolbar,.modeTabs{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);padding:9px 13px;font-weight:950}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.soft{background:var(--teal2);border-color:#9dd9d0;color:#0a5d57}.btn.danger{background:#fff3f1;border-color:#f0b1a9;color:var(--red)}.stage{max-width:1380px;width:100%;margin:auto;flex:1;display:flex;align-items:center;justify-content:center}.panel{width:min(1220px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:30px;padding:clamp(20px,3vw,38px);box-shadow:var(--shadow);text-align:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);font-weight:1000;margin-bottom:8px}.hero{font-size:clamp(38px,6vw,72px);line-height:1.02;font-weight:1000;color:var(--navy);letter-spacing:-.045em;margin:0 auto 8px}.sub{font-size:clamp(15px,1.7vw,21px);color:var(--muted);font-weight:800;margin-bottom:18px}.modeTabs{margin-bottom:14px}.modeBtn.active{background:var(--navy);border-color:var(--navy);color:#fff}.toolbar{margin:0 auto 18px}.classSelect,.sortSelect,.search{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 11px;font-weight:900;color:var(--navy)}.classSelect{min-width:180px}.sortSelect{min-width:150px}.search{min-width:210px}.summary{font-size:13px;color:#0b5b55;font-weight:900;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:13px;text-align:left}.card{position:relative;background:linear-gradient(145deg,#fff,#f5fbfa);border:1px solid #d8e7e4;border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(18,32,46,.06);overflow:hidden;transition:.16s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,32,46,.09)}.card.pop{animation:pop .36s ease}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}.identity{display:flex;align-items:center;gap:10px;min-height:45px}.badge{width:42px;height:42px;border-radius:13px;background:var(--teal2);color:#0b5b55;display:grid;place-items:center;font-size:13px;font-weight:1000;flex:none}.name{font-size:19px;font-weight:1000;color:var(--navy);line-height:1.12;overflow-wrap:anywhere}.scoreRow{display:flex;align-items:end;justify-content:space-between;margin:13px 0 12px}.score{font-size:clamp(46px,6vw,72px);font-weight:1000;line-height:.88;color:var(--navy);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.pts{font-size:11px;font-weight:1000;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-left:5px}.star{font-size:32px;filter:drop-shadow(0 4px 5px rgba(245,158,11,.18))}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pointBtn{border:0;border-radius:11px;min-height:40px;font-weight:1000;background:#e9f8f5;color:#0a655e}.pointBtn.big{background:var(--teal);color:#fff}.pointBtn.minus{background:#fff0ee;color:var(--red)}.pointBtn:active{transform:scale(.96)}.empty{max-width:720px;margin:20px auto 0;padding:34px 22px;border:1px dashed #aacbc5;border-radius:24px;background:#fbfdfd}.emptyIcon{font-size:46px}.emptyTitle{font-size:24px;font-weight:1000;color:var(--navy);margin:6px 0}.emptyText{color:var(--muted);font-weight:800;line-height:1.45}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);background:#17202a;color:#fff;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:.18s;z-index:2147483647}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.shell{padding:8px}.top{margin-bottom:8px;border-radius:17px;padding:9px}.toolIcon{width:44px;height:44px;font-size:23px}.title{font-size:16px}.hint{font-size:10px}.topActions .label{display:none}.panel{border-radius:22px;padding:18px}.grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.classSelect,.sortSelect,.search{min-width:0;flex:1 1 140px}.search{flex-basis:100%}.score{font-size:58px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="toolIcon" id="topIcon">⭐</div><div class="meta"><div class="title" id="topTitle">Pupil Reward Points</div><div class="hint">Recognise positive learning behaviours quickly.</div></div><div class="topActions"><button class="btn soft" id="editBtn">🗂️ <span class="label">Class Organisation</span></button><button class="btn" id="mainBtn">← <span class="label">Main</span></button></div></header>
<main class="stage"><section class="panel">
<div class="eyebrow">Positive reinforcement</div><div class="hero" id="heroTitle">Pupil Reward Points</div><div class="sub" id="heroSub">Tap a pupil, award points, and keep the momentum visible.</div>
<div class="modeTabs"><button class="btn modeBtn" id="pupilTab">⭐ Pupil points</button><button class="btn modeBtn" id="groupTab">🏆 Group points</button></div>
<div class="toolbar"><span style="font-weight:900;color:var(--navy)">Class</span><select class="classSelect" id="classSelect"></select><input class="search" id="search" placeholder="Search"><select class="sortSelect" id="sort"><option value="index">Index order</option><option value="name">Name A–Z</option><option value="points">Highest points</option></select><button class="btn soft" id="undo">↶ Undo</button><button class="btn danger" id="reset">Reset points</button></div>
<div class="summary" id="summary"></div><div class="grid" id="grid"></div>
<div class="empty hidden" id="empty"><div class="emptyIcon" id="emptyIcon">⭐</div><div class="emptyTitle" id="emptyTitle">No pupils found</div><div class="emptyText" id="emptyText">Add pupils in Class Organisation first.</div></div>
</section></main></div><div class="toast" id="toast" aria-live="polite"></div>
<script>
'use strict';
const MASTER_STORE='classroomCompanionClassMasterV1',CC_STORE='classroomCompanionV1',REWARD_STORE='classroomCompanionRewardPointsV1';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let mode=params.get('mode')==='group'?'group':'pupil',klass='',audioCtx=null;
function safe(raw,fallback){try{return JSON.parse(raw)||fallback}catch(e){return fallback}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function tokens(v){return String(v||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean)}
function cc(){return safe(localStorage.getItem(CC_STORE),{})||{}}function master(){return safe(localStorage.getItem(MASTER_STORE),{})||{}}function hasRows(v){return Array.isArray(v)&&v.some(r=>String(r?.pupil||'').trim())}
function classNames(){const d=cc(),m=master(),names=[];if(hasRows(m._general))names.push('General');for(const n of Object.keys(d.classes||{}))if(!names.includes(n))names.push(n);for(const k of Object.keys(m))if(k!=='_general'&&hasRows(m[k])&&!names.includes(k))names.push(k);return names.length?names:['General']}
function selected(){const d=cc(),names=classNames(),s=d.selectedClass||'General';return names.includes(s)?s:names[0]}function setSelected(name){const d=cc();d.classes=d.classes||{};d.selectedClass=name==='General'?'':name;localStorage.setItem(CC_STORE,JSON.stringify(d))}function keyFor(name){return !name||name==='General'?'_general':name}
function rowsFor(name){const key=keyFor(name),m=master();if(hasRows(m[key]))return m[key];const d=cc(),c=d.classes?.[name==='General'?'':name],arr=Array.isArray(c?.names)?c.names:Array.isArray(c)?c:[];return arr.map((x,i)=>({index:String(i+1),pupil:typeof x==='string'?x:(x?.name||x?.pupil||''),group:''})).filter(r=>r.pupil)}
function rewardAll(){return safe(localStorage.getItem(REWARD_STORE),{})||{}}function scoped(){const all=rewardAll(),k=keyFor(klass);return all[k]||{pupils:{},groups:{},history:[]}}function saveScoped(s){const all=rewardAll();all[keyFor(klass)]=s;localStorage.setItem(REWARD_STORE,JSON.stringify(all))}
function entities(){const rows=rowsFor(klass);if(mode==='pupil')return rows.filter(r=>String(r.pupil||'').trim()).map((r,i)=>({key:String(r.pupil).trim(),label:String(r.pupil).trim(),index:String(r.index||i+1)}));const seen=new Map();for(const r of rows)for(const g of tokens(r.group))if(!seen.has(g.toLowerCase()))seen.set(g.toLowerCase(),g);return [...seen.values()].map((g,i)=>({key:g,label:g,index:String(i+1)}))}
function scoreFor(key){const s=scoped(),map=mode==='pupil'?s.pupils:s.groups;return Math.max(0,Number(map?.[key])||0)}
function chime(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();audioCtx.resume();[660,880].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+i*.08;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove('show'),1300)}
function adjust(key,delta){const s=scoped(),kind=mode==='pupil'?'pupils':'groups',map=s[kind]||(s[kind]={}),before=Math.max(0,Number(map[key])||0),after=Math.max(0,before+delta);if(after===before)return;map[key]=after;s.history=Array.isArray(s.history)?s.history:[];s.history.push({kind,key,before,after,at:Date.now()});if(s.history.length>100)s.history=s.history.slice(-100);saveScoped(s);if(delta>0)chime();draw();const card=document.querySelector(`[data-card="${CSS.escape(key)}"]`);if(card){card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop')}toast(`${key}: ${after} points`)}
function undo(){const s=scoped(),kind=mode==='pupil'?'pupils':'groups';s.history=Array.isArray(s.history)?s.history:[];let i=s.history.length-1;while(i>=0&&s.history[i].kind!==kind)i--;if(i<0){toast('Nothing to undo');return}const h=s.history.splice(i,1)[0],map=s[kind]||(s[kind]={});map[h.key]=h.before;saveScoped(s);draw();toast(`Undid last change for ${h.key}`)}
function resetPoints(){const label=mode==='pupil'?'all pupil':'all group';if(!confirm(`Reset ${label} points for ${klass} to 0?`))return;const s=scoped(),kind=mode==='pupil'?'pupils':'groups';s[kind]={};s.history=(s.history||[]).filter(h=>h.kind!==kind);saveScoped(s);draw();toast('Points reset')}
function buildClassSelect(){const names=classNames();$('#classSelect').innerHTML=names.map(n=>`<option ${n===klass?'selected':''}>${esc(n)}</option>`).join('')}
function configureMode(){const pupil=mode==='pupil';document.title=(pupil?'Pupil':'Group')+' Reward Points • Classroom Companion';$('#topIcon').textContent=pupil?'⭐':'🏆';$('#topTitle').textContent=pupil?'Pupil Reward Points':'Group Reward Points';$('#heroTitle').textContent=pupil?'Pupil Reward Points':'Group Reward Points';$('#heroSub').textContent=pupil?'Tap a pupil, award points, and keep the momentum visible.':'Reward teamwork and make positive group effort visible.';$('#pupilTab').classList.toggle('active',pupil);$('#groupTab').classList.toggle('active',!pupil);$('#search').placeholder=pupil?'Search pupil':'Search group';$('#emptyIcon').textContent=pupil?'⭐':'🏆';$('#emptyTitle').textContent=pupil?'No pupils found':'No groups found';$('#emptyText').textContent=pupil?'Add pupils in Class Organisation first.':'Assign pupils to groups in Class Organisation first.';$('#sort').innerHTML=pupil?'<option value="index">Index order</option><option value="name">Name A–Z</option><option value="points">Highest points</option>':'<option value="name">Group A–Z</option><option value="points">Highest points</option>'}
function draw(){configureMode();let list=entities(),q=$('#search').value.trim().toLowerCase(),sort=$('#sort').value;if(q)list=list.filter(x=>x.label.toLowerCase().includes(q));if(sort==='points')list.sort((a,b)=>scoreFor(b.key)-scoreFor(a.key)||a.label.localeCompare(b.label));else if(sort==='name')list.sort((a,b)=>a.label.localeCompare(b.label));else list.sort((a,b)=>(+a.index||999)-(+b.index||999)||a.label.localeCompare(b.label));const grid=$('#grid'),empty=$('#empty');if(!list.length){grid.innerHTML='';empty.classList.remove('hidden');$('#summary').textContent='';return}empty.classList.add('hidden');const total=list.reduce((n,x)=>n+scoreFor(x.key),0);$('#summary').textContent=`${list.length} ${mode==='pupil'?(list.length===1?'pupil':'pupils'):(list.length===1?'group':'groups')} • ${total} total points`;grid.innerHTML=list.map(x=>{const p=scoreFor(x.key);return `<article class="card" data-card="${esc(x.key)}"><div class="identity"><div class="badge">${mode==='pupil'?esc(x.index):'🏆'}</div><div class="name">${esc(x.label)}</div></div><div class="scoreRow"><div><span class="score">${p}</span><span class="pts">pts</span></div><div class="star">${p>=20?'🌟':p>=10?'⭐':'✨'}</div></div><div class="actions"><button class="pointBtn" data-key="${esc(x.key)}" data-delta="1">+1</button><button class="pointBtn" data-key="${esc(x.key)}" data-delta="2">+2</button><button class="pointBtn big" data-key="${esc(x.key)}" data-delta="5">+5</button><button class="pointBtn minus" data-key="${esc(x.key)}" data-delta="-1">−1</button></div></article>`}).join('')}
klass=selected();buildClassSelect();configureMode();draw();
$('#grid').onclick=e=>{const b=e.target.closest('[data-delta]');if(b)adjust(b.dataset.key,Number(b.dataset.delta))};$('#classSelect').onchange=e=>{klass=e.target.value;setSelected(klass);draw()};$('#search').oninput=draw;$('#sort').onchange=draw;$('#undo').onclick=undo;$('#reset').onclick=resetPoints;$('#pupilTab').onclick=()=>{if(mode!=='pupil')location.href='reward-points.html?mode=pupil'};$('#groupTab').onclick=()=>{if(mode!=='group')location.href='reward-points.html?mode=group'};$('#editBtn').onclick=()=>location.href='class-organisation.html?v='+Date.now();$('#mainBtn').onclick=()=>location.href='./';window.addEventListener('storage',e=>{if([MASTER_STORE,CC_STORE,REWARD_STORE].includes(e.key)){klass=selected();buildClassSelect();draw()}});
</script>
<script src="tool-backup.js?v=20261010b1"></script>
</body>
</html>
