/* Keep Settings at the top-right of the main header on every screen size. */
.top{position:relative}
#mainSettingsBtn{position:absolute!important;top:8px!important;right:10px!important;margin:0!important;z-index:120;order:0!important}
.brand{padding-right:125px}

/* Document actions share the same compact header row as Whiteboard. */

/* Alpha document workspace: control surfaces must never overlay lesson content.

body.document-open-mode{--cc-document-rail-gutter:128px}

 margin-right:var(--cc-document-rail-gutter)!important;
 min-width:0!important;
}

.top > #mainSettingsBtn{
 position:static!important;
 top:auto!important;
 right:auto!important;
 margin:0!important;

.top > .brand{padding-right:0!important}
