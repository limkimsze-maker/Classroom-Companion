    html=html.replace('</style>',toolCss+'</style>');
    html=html.replace('<body>','<body><div id="ccToolHead"><button class="ccHeadBtn launcher" id="ccToolLauncherBtn" type="button" title="Open another tool" aria-label="Open classroom tools">✦</button><div id="ccToolIcon">✦</div><div id="ccToolMeta"><div id="ccToolTitle">Classroom Tool</div><div id="ccToolStatus">Ready</div></div><button class="ccHeadBtn primary" id="ccToolOptionsBtn" type="button">••• Options</button><button class="ccHeadBtn" id="ccToolCloseBtn" type="button">×</button></div><main id="ccToolStage"><div id="ccStageIcon">✦</div><div id="ccStageValue">Choose an option</div><div id="ccStageHint">Select from the dropdown above.</div></main>');
    const addon=`

<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search),slug=params.get('tool')||'';
const removedDuplicates=new Set(['movement-break','end-of-lesson-self-check']);
const tools=(typeof allTools!=='undefined'&&Array.isArray(allTools))?allTools.filter(x=>!removedDuplicates.has(x.slug)):[];
const t=tools.find(x=>x.slug===slug);
const title=document.getElementById('ccToolTitle'),icon=document.getElementById('ccToolIcon'),status=document.getElementById('ccToolStatus');
const stageIcon=document.getElementById('ccStageIcon'),stageValue=document.getElementById('ccStageValue'),stageHint=document.getElementById('ccStageHint');
let lastDisplay='Choose an option';
try{window.fitStrip=()=>{};fitStrip=window.fitStrip;window.restoreStrip=()=>{};restoreStrip=window.restoreStrip}catch(e){}
if(t){title.textContent=t.title;icon.textContent=t.icon;stageIcon.textContent=t.icon;stageHint.textContent=t.title;document.title=t.title+' • Classroom Companion'}else{title.textContent='Tool unavailable';status.textContent='Could not identify this tool';document.getElementById('quickbar')?.classList.add('show');const q=document.getElementById('quickScroll');if(q)q.innerHTML='<div class="quick-value">This tool could not be identified. Close this window and open it again from the ✦ launcher.</div>'}
function currentDisplay(){
  try{
    if(['timer-calm-music','transition-countdown','focus-intervals','calm-reset'].includes(slug))return format(timer.sec);
    if(slug==='noise-level')return document.getElementById('noiseVal')?.textContent||lastDisplay;
    if(slug==='question-spinner')return document.getElementById('questionVal')?.textContent||lastDisplay;
    if(slug==='pick-a-pupil')return document.getElementById('pickVal')?.textContent||lastDisplay;
    if(slug==='participation-counter')return String(participation);
    if(slug==='whole-class-goal')return String(goal);
  }catch(e){}
  return lastDisplay;
}
function updateStage(){const v=currentDisplay();if(v)stageValue.textContent=v}
function setStatus(){
  try{
    if(['timer-calm-music','transition-countdown','focus-intervals','calm-reset'].includes(slug)){status.textContent=format(timer.sec)+' • '+(timer.running?'Running':'Ready');updateStage();return}
    if(slug==='noise-level'){status.textContent=document.getElementById('noiseVal')?.textContent||'Ready';updateStage();return}
    if(slug==='question-spinner'){status.textContent=document.getElementById('questionVal')?.textContent||'Ready';updateStage();return}
    if(slug==='pick-a-pupil'){status.textContent=document.getElementById('pickVal')?.textContent||'Ready';updateStage();return}
    if(slug==='participation-counter'){status.textContent=participation+' responses';updateStage();return}
    if(slug==='whole-class-goal'){status.textContent=String(goal);updateStage();return}
  }catch(e){}
  status.textContent='Ready';
  updateStage();
}
async function enterPresentation(){
  const el=document.documentElement;
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(el.requestFullscreen)await el.requestFullscreen();
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }
  }catch(e){
    try{window.moveTo(0,0);window.resizeTo(screen.availWidth||1280,screen.availHeight||800)}catch(_){}
  }
}
function showRequestedOptions(){
  if(!t)return;
  try{
    switch(slug){
      case'timer-calm-music':timerOptions();break;
      case'noise-level':showQuick('Noise level',noiseLevels.map(x=>({label:x,active:document.getElementById('noiseVal')?.textContent===x,action:()=>{chooseNoise(x);showValue('Noise level',x)}})));break;
      case'question-spinner':showQuick('Question',questionPrompts.map(x=>({label:x,action:()=>{document.getElementById('questionVal').textContent=x;showValue('Question',x)}})));break;
      case'pick-a-pupil':showQuick('Pick pupil',[{label:'Pick now',primary:true,action:()=>{pickPupil();showValue('Pick pupil',document.getElementById('pickVal')?.textContent||'Ready')}},{label:'New round',action:()=>{resetPicker();showValue('Pick pupil','New round ready')}},{label:'Manage class',action:()=>openConfig('class')}]);break;
      case'rewards':showQuick('Reward',[...['Focus','Effort','Kindness','Teamwork','Ready','Helpful','Perseverance','Responsible','Improved'].map(x=>({label:x,action:()=>{addPoint(x);showValue('Reward',x)}})),{label:'Reset points',action:()=>{data.classPoints[classKey()]=0;saveData();renderPoints();showValue('Reward','Points reset')}}]);break;
      default:toolOptions(t);
    }
  }catch(e){try{instantTool(t)}catch(_){showQuick(t.title,[{type:'value',label:'This tool could not open.'}],{withStop:false})}}
  setTimeout(setStatus,80);
}
function toolWindowName(s){return 'ClassroomCompanionTool_'+String(s).replace(/[^a-z0-9]/gi,'_')}
function openAnotherTool(other){
  if(!other)return;
  if(other.slug===slug){showRequestedOptions();return}
  const sw=screen.availWidth||1280,sh=screen.availHeight||800;
  const width=Math.min(520,sw),height=Math.min(680,sh);
  const left=Math.max(0,Math.min(sw-width,(window.screenX||100)+42));
  const top=Math.max(0,Math.min(sh-height,(window.screenY||60)+36));
  const url='tool-window.html?tool='+encodeURIComponent(other.slug)+'&v='+Date.now();
  const w=window.open(url,toolWindowName(other.slug),'popup=yes,width='+width+',height='+height+',left='+left+',top='+top+',resizable=yes,scrollbars=yes,toolbar=no,location=no,menubar=no,status=no');
  if(!w){showQuick('Pop-up blocked',[{type:'value',label:'Allow pop-ups for this site to open another classroom tool.'}],{withStop:false});return}
  closeQuick();try{w.focus()}catch(e){}
}
function showToolLauncher(){
  if(!tools.length)return;
  const items=tools.map(other=>({label:(other.slug===slug?'● ':'')+other.icon+' '+other.title,active:other.slug===slug,action:()=>openAnotherTool(other)}));
  showQuick('All Tools',items,{withStop:false});
}
const quick=document.getElementById('quickbar');
quick.addEventListener('click',e=>{
  const chip=e.target.closest('.quick-chip');if(!chip)return;
  const qTitle=document.getElementById('quickTitle')?.textContent||'';
  if(qTitle==='All Tools')return;
  enterPresentation();
  setTimeout(()=>{
    const qv=document.querySelector('#quickbar .quick-value');
    if(qv?.textContent?.trim())lastDisplay=qv.textContent.trim();
    else{const v=currentDisplay();if(v)lastDisplay=v}
    try{closeQuick()}catch(_){}
    updateStage();setStatus();
  },100);
},true);
document.getElementById('ccToolLauncherBtn').onclick=showToolLauncher;
document.getElementById('ccToolOptionsBtn').onclick=showRequestedOptions;
document.getElementById('ccToolCloseBtn').onclick=()=>window.close();
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='classroom-companion-show-options'){showRequestedOptions();try{window.focus()}catch(_){}}});
setInterval(setStatus,500);
setTimeout(showRequestedOptions,50);
})();
<\/script>`;
    html=html.replace('</body>',addon+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="loading">Could not open this classroom tool. Please close this window and try again.</div>';console.error(e)}
})();
</script>
