<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Classroom Companion — All Tools</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div style="font-family:system-ui;padding:24px">Loading Classroom Companion…</div>
<script>
(function(){
  let returned=false;
  function returnToStrip(){
    if(returned)return;
    returned=true;
    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage({type:'classroom-companion-return-to-strip'},location.origin);
        window.opener.focus();
      }
    }catch(e){}
  }
  window.addEventListener('beforeunload',returnToStrip);
  window.addEventListener('pagehide',returnToStrip);
})();

(async()=>{
  try{
    const files=['fragment1.html','fragment2.html','fragment3.html','fragment4.html','fragment5.html'];
    const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    document.body.innerHTML=parts.join('');
    for(const src of ['app-part1.js','app-part2.js','app-part3.js','app-part4.js','app-part5.js']){
      await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
    }
  }catch(e){
    document.body.innerHTML='<div style="font-family:system-ui;padding:24px"><h1>Classroom Companion</h1><p>Could not load the toolkit. Refresh the page.</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
