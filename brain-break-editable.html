<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain Break</title></head>
<body>
<script>
(async()=>{
  try{
    const r=await fetch('brain-break.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('brain break '+r.status);
    let html=await r.text();
    html=html.replace('</body>','<script src="editable-content-settings.js?v=20261007edit1"><\\/script></body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<button onclick="location.reload()">Retry</button>';
    console.error(e);
  }
})();
</script>
</body>
</html>
