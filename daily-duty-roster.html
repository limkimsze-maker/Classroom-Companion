<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Daily Duty Roster • Classroom Companion</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--ink:#17202a;--muted:#667085;--line:#d8e1e8;--shadow:0 18px 55px rgba(18,32,46,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 8%,#fff 0,#f2f8f7 35%,#e8f0f3 100%)}button,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;padding:16px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;max-width:1320px;width:100%;margin:0 auto 14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:11px 13px;box-shadow:0 10px 30px rgba(18,32,46,.08);position:relative;z-index:5}.toolIcon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--teal2);font-size:28px}.meta{min-width:0;flex:1}.title{font-size:20px;font-weight:1000;color:var(--navy);letter-spacing:-.02em}.hint{font-size:12px;color:var(--muted);font-weight:750;margin-top:3px}.topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);padding:9px 13px;font-weight:950}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.soft{background:var(--teal2);border-color:#9dd9d0;color:#0a5d57}.stage{max-width:1320px;width:100%;margin:auto;flex:1;display:flex;align-items:center;justify-content:center}.panel{width:min(1120px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:30px;padding:clamp(20px,3vw,42px);box-shadow:var(--shadow);text-align:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);font-weight:1000;margin-bottom:9px}.hero{font-size:clamp(38px,6vw,72px);line-height:1.02;font-weight:1000;color:var(--navy);letter-spacing:-.045em;margin:0 auto 8px}.dateLine{font-size:clamp(15px,1.8vw,22px);color:var(--muted);font-weight:850;margin-bottom:18px}.classBar,.dayBar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.classBar{margin-bottom:12px}.classSelect{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 11px;font-weight:900;color:var(--navy);min-width:190px}.dayBar{margin:4px auto 22px}.dayBtn{min-width:92px}.dayBtn.active{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 7px 18px rgba(15,118,110,.18)}.rosterGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px;text-align:left}.dutyCard{border:1px solid #d8e7e4;border-radius:22px;background:linear-gradient(145deg,#fff,#f4fbf9);padding:17px;box-shadow:0 8px 22px rgba(18,32,46,.06)}.dutyHead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.dutyIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#fff;border:1px solid #d9e7e4;font-size:27px;flex:none}.dutyName{font-size:20px;font-weight:1000;color:var(--navy);line-height:1.12}.name{display:flex;align-items:center;gap:9px;padding:9px 10px;margin-top:7px;border-radius:12px;background:#fff;border:1px solid #e4ecee;color:var(--navy);font-size:17px;font-weight:900}.no{width:28px;height:28px;border-radius:9px;background:var(--teal2);color:#0b5b55;display:grid;place-items:center;font-size:11px;font-weight:1000;flex:none}.empty{max-width:720px;margin:18px auto 0;padding:34px 22px;border:1px dashed #aacbc5;border-radius:24px;background:#fbfdfd}.emptyIcon{font-size:46px}.emptyTitle{font-size:24px;font-weight:1000;color:var(--navy);margin:6px 0}.emptyText{color:var(--muted);font-weight:800;line-height:1.45}.footerActions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px}.summary{margin:0 0 14px;color:#0b5b55;font-size:13px;font-weight:900}.hidden{display:none!important}@media(max-width:760px){.shell{padding:8px}.top{margin-bottom:8px;border-radius:17px;padding:9px}.toolIcon{width:44px;height:44px;font-size:23px}.title{font-size:16px}.hint{font-size:10px}.panel{border-radius:22px;padding:18px}.topActions .label{display:none}.dayBar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.dayBtn{min-width:0;padding:8px 4px;font-size:11px}.rosterGrid{grid-template-columns:1fr}.classSelect{min-width:0;flex:1}.dutyName{font-size:18px}.name{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="toolIcon">🧹</div><div class="meta"><div class="title">Daily Duty Roster</div><div class="hint">Everyone knows how to help the class today.</div></div><div class="topActions"><button class="btn soft" id="editBtn">🗂️ <span class="label">Edit duties</span></button><button class="btn" id="mainBtn">← <span class="label">Main</span></button></div></header>
<main class="stage"><section class="panel">
<div class="eyebrow">Classroom responsibilities</div><div class="hero" id="dayTitle">Monday Duties</div><div class="dateLine" id="dateLine"></div>
<div class="classBar"><span style="font-weight:900;color:var(--navy)">Class</span><select class="classSelect" id="classSelect"></select></div>
<div class="dayBar" id="dayBar"></div><div class="summary" id="summary"></div><div class="rosterGrid" id="roster"></div>
<div class="empty hidden" id="empty"><div class="emptyIcon">🧹</div><div class="emptyTitle">No duties assigned</div><div class="emptyText" id="emptyText">Add Duty Day and Duty Responsibility in Class Organisation.</div></div>
<div class="footerActions"><button class="btn soft" id="editBottom">🗂️ Edit duties in Class Organisation</button></div>
</section></main></div>
<script>
'use strict';
const MASTER_STORE='classroomCompanionClassMasterV1',CC_STORE='classroomCompanionV1',OLD_DUTY='classroomCompanionDutyRosterV1';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const $=s=>document.querySelector(s);function safe(raw,fallback){try{return JSON.parse(raw)||fallback}catch(e){return fallback}}function tokens(v){return String(v||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean)}
function cc(){return safe(localStorage.getItem(CC_STORE),{})||{}}function master(){return safe(localStorage.getItem(MASTER_STORE),{})||{}}function oldDuty(){return safe(localStorage.getItem(OLD_DUTY),{})||{}}
function hasRows(v){return Array.isArray(v)&&v.some(r=>String(r?.pupil||'').trim())}
function classNames(){const d=cc(),m=master(),names=[];if(hasRows(m._general)||oldDuty()?._general)names.push('General');for(const n of Object.keys(d.classes||{}))if(!names.includes(n))names.push(n);for(const k of Object.keys(m))if(k!=='_general'&&hasRows(m[k])&&!names.includes(k))names.push(k);for(const k of Object.keys(oldDuty())){const n=k==='_general'?'General':k;if(!names.includes(n))names.push(n)}return names.length?names:['General']}
function selected(){const d=cc(),names=classNames(),s=d.selectedClass||'General';return names.includes(s)?s:names[0]}
function setSelected(name){const d=cc();d.classes=d.classes||{};d.selectedClass=name==='General'?'':name;localStorage.setItem(CC_STORE,JSON.stringify(d))}
function keyFor(name){return !name||name==='General'?'_general':name}
function rowsFor(name){const key=keyFor(name),m=master();if(hasRows(m[key]))return m[key];const legacy=oldDuty()[key];if(!legacy?.days)return[];const out=[];for(const day of DAYS)for(const d of(legacy.days[day]||[]))out.push({index:d.index||'',pupil:d.person||'',dutyDay:day,dutyResponsibility:d.task||'Class duty'});return out}
function icon(task){const s=String(task).toLowerCase();if(/board|whiteboard/.test(s))return'🧽';if(/sweep|floor|broom/.test(s))return'🧹';if(/book|worksheet|paper/.test(s))return'📚';if(/plant|water/.test(s))return'🌱';if(/chair|table|desk/.test(s))return'🪑';if(/light|fan|electric/.test(s))return'💡';if(/door|window/.test(s))return'🚪';if(/ict|device|computer|tablet|chromebook/.test(s))return'💻';if(/bin|trash|rubbish|recycl/.test(s))return'🗑️';if(/attendance|register/.test(s))return'📋';if(/line|leader/.test(s))return'🚶';return'⭐'}
function dutiesFor(row,day){const days=tokens(row.dutyDay),tasks=tokens(row.dutyResponsibility);const i=days.findIndex(x=>x.toLowerCase()===day.toLowerCase());if(i<0)return[];if(days.length===tasks.length&&tasks.length>1)return[tasks[i]||'Class duty'];return tasks.length?tasks:['Class duty']}
const now=new Date(),weekday=now.getDay(),defaultDay=weekday>=1&&weekday<=5?DAYS[weekday-1]:'Monday';let day=defaultDay,klass=selected();
function buildClassSelect(){const names=classNames();$('#classSelect').innerHTML=names.map(n=>`<option ${n===klass?'selected':''}>${n.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</option>`).join('')}
function buildDays(){$('#dayBar').innerHTML=DAYS.map(d=>`<button class="btn dayBtn ${d===day?'active':''}" data-day="${d}">${d.slice(0,3)}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;draw()})}
function draw(){buildDays();$('#dayTitle').textContent=day+' Duties';const isToday=weekday>=1&&weekday<=5&&DAYS[weekday-1]===day;$('#dateLine').textContent=isToday?new Intl.DateTimeFormat('en-SG',{weekday:'long',day:'numeric',month:'long'}).format(now):(weekday===0||weekday===6)&&day==='Monday'?'Weekend preview • Monday':'View '+day;const rows=rowsFor(klass),items=[];for(const r of rows){if(!String(r.pupil||'').trim())continue;for(const task of dutiesFor(r,day))items.push({task,pupil:String(r.pupil).trim(),index:String(r.index||'')})}const groups=new Map();for(const x of items){const k=x.task.trim()||'Class duty';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)};const roster=$('#roster'),empty=$('#empty');if(!items.length){roster.innerHTML='';empty.classList.remove('hidden');$('#emptyText').textContent=`No ${day} duties are assigned for ${klass}. Add them in Class Organisation.`;$('#summary').textContent='';return}empty.classList.add('hidden');$('#summary').textContent=`${items.length} pupil${items.length===1?'':'s'} • ${groups.size} responsibilit${groups.size===1?'y':'ies'}`;roster.innerHTML=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([task,people])=>`<article class="dutyCard"><div class="dutyHead"><div class="dutyIcon">${icon(task)}</div><div class="dutyName">${task.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div></div>${people.sort((a,b)=>(+a.index||999)-(+b.index||999)||a.pupil.localeCompare(b.pupil)).map(p=>`<div class="name"><span class="no">${p.index||'•'}</span><span>${p.pupil.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span></div>`).join('')}</article>`).join('')}
function edit(){location.href='class-organisation.html?v='+Date.now()}$('#mainBtn').onclick=()=>location.href='./';$('#editBtn').onclick=edit;$('#editBottom').onclick=edit;$('#classSelect').onchange=e=>{klass=e.target.value;setSelected(klass);draw()};buildClassSelect();draw();
window.addEventListener('storage',e=>{if(e.key===MASTER_STORE||e.key===CC_STORE||e.key===OLD_DUTY){klass=selected();buildClassSelect();draw()}});
</script>
</body>
</html>
