<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Classroom Companion</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--ink:#17202a;--muted:#667085;--line:#d8e1e8;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eff8f6,#f7f9fc 55%,#edf3f8);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:20px}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 24px 60px rgba(18,32,46,.12)}.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:28px;font-weight:950;margin-bottom:16px}h1{font-size:30px;line-height:1.05;margin:0 0 8px;letter-spacing:-.03em}p{color:var(--muted);line-height:1.55;margin:0 0 22px}.buttons{display:grid;gap:10px}.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:15px;min-height:52px;padding:12px 16px;background:#fff;color:var(--ink);font-weight:900;font-size:16px;cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn:hover{filter:brightness(.98)}.note{font-size:12px;color:var(--muted);margin-top:16px}.status{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:13px;font-weight:750}.status.show{display:block}.launched{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.launched .box{max-width:420px}.launched .tick{font-size:46px;margin-bottom:8px}.launched h2{margin:0 0 8px}.launched p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">✦</div>
  <h1>Classroom Companion</h1>
  <p>Launch one tiny classroom widget. Tap it whenever you need a tool.</p>
  <div class="buttons">
    <button class="btn primary" id="launch" type="button">✦ Launch Classroom Widget</button>
    <a class="btn" href="full.html">Open Full Toolkit</a>
  </div>
  <div class="note">No login • No installation • No ads • No subscription</div>
  <div class="status" id="status">The popup was blocked. Allow popups for this site, then press Launch Classroom Widget again.</div>
</main>
<script>
const launch=document.getElementById('launch'),status=document.getElementById('status');
let stripWindow=null;
launch.onclick=()=>{
  status.classList.remove('show');
  if(stripWindow && !stripWindow.closed){try{stripWindow.focus()}catch(e){}return}

  const mobile=matchMedia('(max-width:700px)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const sw=screen.availWidth||760,sh=screen.availHeight||800;
  const popupWidth=mobile?Math.max(360,Math.min(sw,700)):118;
  const popupHeight=mobile?Math.max(220,Math.min(sh,360)):112;
  const stripUrl='widget-launch.html?v='+Date.now();
  const pos=mobile?'':',left=8,top=8';
  const features=`popup=yes,width=${popupWidth},height=${popupHeight}${pos},resizable=yes,scrollbars=no,toolbar=no,location=no,menubar=no,status=no`;
  stripWindow=window.open(stripUrl,'ClassroomCompanionStrip',features);
  if(!stripWindow){status.classList.add('show');return}
  try{stripWindow.opener=null}catch(e){}

  const injectStripEnhancements=()=>{
    try{
      if(!stripWindow||stripWindow.closed||!stripWindow.document?.body)return false;
      const d=stripWindow.document;
      if(!d.getElementById('shortcutTrack'))return false;
      const ensure=(id,src)=>{
        if(d.getElementById(id))return;
        const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s);
      };
      ensure('transitionStripPatch','transition-strip.js?v=20261003transition2');
      ensure('brainBreakStripPatch','brain-break-strip.js?v=20261003bb3');
      ensure('clockStripPatch','clock-strip.js?v=20261003clock3');
      ensure('compactWidgetPatch','compact-widget.js?v=20261003compact7');
      return true;
    }catch(e){return false}
  };

  const focusStrip=()=>{
    try{
      if(stripWindow.closed)return;
      const d=stripWindow.document;
      if(d?.fullscreenElement||d?.webkitFullscreenElement)return;
      if(!mobile){try{stripWindow.moveTo(8,8)}catch(e){}}
      stripWindow.focus();
    }catch(e){}
  };

  const retry=setInterval(()=>{injectStripEnhancements()},250);
  setTimeout(()=>clearInterval(retry),10000);
  try{stripWindow.addEventListener('load',()=>{injectStripEnhancements();focusStrip()})}catch(e){}

  focusStrip();
  setTimeout(focusStrip,150);
  setTimeout(focusStrip,450);
  setTimeout(()=>{
    injectStripEnhancements();
    focusStrip();
    document.body.innerHTML='<div class="launched"><div class="box"><div class="tick">✓</div><h2>Classroom widget is running</h2><p>Tap the small ✦ widget to choose a tool. The launcher stays quietly in the background.</p></div></div>';
    try{window.blur();if(!(stripWindow.document?.fullscreenElement||stripWindow.document?.webkitFullscreenElement))stripWindow.focus()}catch(e){}
  },900);
};
</script>
</body>
</html>
