<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Class Organisation Dashboard</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--ink:#17202a;--muted:#667085;--line:#d6e2e1;--bg:#edf5f4;--white:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#eaf6f4,#f7f9fc 58%,#edf3f8);color:var(--ink)}button,select{font:inherit}.shell{padding:18px;max-width:1600px;margin:auto}.head{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:15px 18px;box-shadow:0 16px 44px rgba(18,32,46,.11);position:sticky;top:10px;z-index:20;backdrop-filter:blur(12px)}.mark{width:52px;height:52px;border-radius:17px;background:var(--teal2);color:var(--teal);display:grid;place-items:center;font-size:27px}.meta{min-width:0;flex:1}.title{font-size:clamp(22px,2.1vw,34px);font-weight:1000;color:var(--navy);letter-spacing:-.025em}.sub{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}.headBtns{display:flex;gap:8px}.headBtn{min-height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:8px 13px;font-weight:950;color:var(--navy);cursor:pointer}.headBtn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;margin:16px 0;padding:13px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 22px rgba(18,32,46,.06)}.filter{display:grid;gap:5px}.filter label{font-size:11px;font-weight:1000;color:#52606d;text-transform:uppercase;letter-spacing:.06em}.filter select{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 11px;font-weight:900;color:var(--navy)}.clear{align-self:end;height:44px;border:1px solid #add6d0;border-radius:12px;background:var(--teal2);color:#0b5b55;padding:0 14px;font-weight:950;cursor:pointer}.section{margin:16px 0}.sectionHead{display:flex;align-items:end;gap:10px;margin:0 2px 9px}.sectionTitle{font-size:clamp(20px,2vw,30px);font-weight:1000;color:var(--navy)}.count{font-size:11px;font-weight:950;color:#0b5b55;background:var(--teal2);border-radius:999px;padding:5px 9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 22px rgba(18,32,46,.06)}.dayCard h3,.groupCard h3{margin:0 0 10px;font-size:20px;color:var(--teal)}.table{display:grid;gap:6px}.row{display:grid;grid-template-columns:72px minmax(120px,1fr) minmax(120px,1fr);gap:8px;align-items:center;padding:8px 9px;border-radius:11px;background:#f7fafb}.row.head{background:#eef6f5;box-shadow:none;border:0;position:static;padding:7px 9px}.cell{min-width:0;overflow-wrap:anywhere}.idx{font-size:12px;font-weight:1000;color:var(--muted);text-align:center}.main{font-size:14px;font-weight:1000;color:var(--navy)}.accent{font-size:14px;font-weight:1000;color:var(--teal)}.roleCard{display:grid;gap:8px}.roleTop{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center}.roleName{font-size:18px;font-weight:1000;color:var(--teal)}.person{font-size:16px;font-weight:1000;color:var(--navy)}.resp{font-size:13px;line-height:1.4;color:#52606d;font-weight:750;padding-top:8px;border-top:1px solid #edf1f3}.groupMembers{display:grid;gap:6px}.member{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;padding:8px 9px;border-radius:11px;background:#f7fafb}.empty{grid-column:1/-1;padding:28px;text-align:center;border:1px dashed #b7c9c8;border-radius:18px;background:rgba(255,255,255,.78);color:var(--muted);font-weight:850}.hidden{display:none!important}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:8px}.head{top:5px;padding:11px}.mark{width:44px;height:44px}.sub{display:none}.headBtn span{display:none}.filters{grid-template-columns:1fr}.clear{width:100%}.cards{grid-template-columns:1fr}.row{grid-template-columns:58px 1fr}.row .cell:nth-child(3){grid-column:2}.row.head{display:none}.roleTop,.member{grid-template-columns:58px 1fr}}
@media(min-width:1200px){body.fullscreen .shell{padding:1.4vw}body.fullscreen .filters{position:sticky;top:92px;z-index:15}.cards{gap:1vw}.card{padding:1.15vw}.dayCard h3,.groupCard h3{font-size:clamp(20px,1.6vw,28px)}.main,.accent{font-size:clamp(14px,1.12vw,20px)}.person{font-size:clamp(16px,1.3vw,23px)}.roleName{font-size:clamp(18px,1.45vw,25px)}.resp{font-size:clamp(13px,1vw,18px)}}
</style>
</head>
<body>
<div class="shell">
<header class="head"><div class="mark">🗂️</div><div class="meta"><div class="title">Class Organisation</div><div class="sub" id="classLabel">Class overview</div></div><div class="headBtns"><button class="headBtn primary" id="fullBtn">⛶ <span>Full Screen</span></button><button class="headBtn" id="closeBtn">✕ <span>Close</span></button></div></header>
<div class="filters">
  <div class="filter"><label for="dayFilter">Day</label><select id="dayFilter"><option value="all">All days</option></select></div>
  <div class="filter"><label for="groupFilter">Group</label><select id="groupFilter"><option value="all">All groups</option></select></div>
  <div class="filter"><label for="roleFilter">Responsibility</label><select id="roleFilter"><option value="all">All responsibilities</option></select></div>
  <button class="clear" id="clearFilters">Clear filters</button>
</div>
<section class="section" id="dutySection"><div class="sectionHead"><div class="sectionTitle">🧹 Duty Roster</div><div class="count" id="dutyCount"></div></div><div class="cards" id="dutyCards"></div></section>
<section class="section" id="rolesSection"><div class="sectionHead"><div class="sectionTitle">🪪 Roles & Responsibilities</div><div class="count" id="roleCount"></div></div><div class="cards" id="roleCards"></div></section>
<section class="section" id="groupsSection"><div class="sectionHead"><div class="sectionTitle">👥 Group Names & Members</div><div class="count" id="groupCount"></div></div><div class="cards" id="groupCards"></div></section>
</div>
<script>
'use strict';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'],CC_STORE='classroomCompanionV1',DUTY_STORE='classroomCompanionDutyRosterV1',ROLES_STORE='classroomCompanionRolesV1',GROUPS_STORE='classroomCompanionSavedGroupsV1';
const $=s=>document.querySelector(s);function parse(k,f={}){try{return JSON.parse(localStorage.getItem(k)||'null')||f}catch(e){return f}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
const cc=parse(CC_STORE,{}),classKey=cc.selectedClass||'_general',className=cc.selectedClass||'General';$('#classLabel').textContent='Class: '+className;
const dutyAll=parse(DUTY_STORE,{}),rolesAll=parse(ROLES_STORE,{}),groupsAll=parse(GROUPS_STORE,{}),duty=dutyAll[classKey]||{days:{}},roles=Array.isArray(rolesAll[classKey])?rolesAll[classKey]:[],groups=Array.isArray(groupsAll[classKey])?groupsAll[classKey]:[];
for(const d of DAYS){const o=document.createElement('option');o.value=d;o.textContent=d;$('#dayFilter').appendChild(o)}for(const g of groups){const o=document.createElement('option');o.value=g.name||'';o.textContent=g.name||'Unnamed Group';$('#groupFilter').appendChild(o)}for(const name of [...new Set(roles.map(r=>String(r.role||'').trim()).filter(Boolean))]){const o=document.createElement('option');o.value=name;o.textContent=name;$('#roleFilter').appendChild(o)}
function dutyRows(day){return Array.isArray(duty.days?.[day])?duty.days[day]:[]}
function renderDuty(){const f=$('#dayFilter').value,days=f==='all'?DAYS:[f],out=[];for(const day of days){const rows=dutyRows(day);if(!rows.length)continue;out.push(`<article class="card dayCard"><h3>${esc(day)}</h3><div class="table"><div class="row head"><div class="idx">Index</div><div class="accent">Duty</div><div class="main">Pupil</div></div>${rows.map(r=>`<div class="row"><div class="cell idx">${esc(r.index||'—')}</div><div class="cell accent">${esc(r.task||'—')}</div><div class="cell main">${esc(r.person||'—')}</div></div>`).join('')}</div></article>`)}$('#dutyCards').innerHTML=out.join('')||'<div class="empty">No duty roster entries match this day.</div>';$('#dutyCount').textContent=days.length===1?days[0]:`${out.length} days`}
function renderRoles(){const f=$('#roleFilter').value,list=f==='all'?roles:roles.filter(r=>String(r.role||'')===f);$('#roleCards').innerHTML=list.length?list.map(r=>`<article class="card roleCard"><div class="roleTop"><div class="idx">Index ${esc(r.index||'—')}</div><div><div class="roleName">${esc(r.role||'Role')}</div><div class="person">${esc(r.person||'Unassigned')}</div></div></div><div class="resp">${esc(r.responsibility||'No responsibility entered.')}</div></article>`).join(''):'<div class="empty">No role matches this responsibility filter.</div>';$('#roleCount').textContent=f==='all'?`${list.length} roles`:f}
function renderGroups(){const f=$('#groupFilter').value,list=f==='all'?groups:groups.filter(g=>String(g.name||'')===f);$('#groupCards').innerHTML=list.length?list.map(g=>`<article class="card groupCard"><h3>${esc(g.name||'Unnamed Group')}</h3><div class="groupMembers">${(g.members||[]).length?(g.members||[]).map(m=>`<div class="member"><div class="idx">${esc(m.index||'—')}</div><div class="person">${esc(m.person||'—')}</div></div>`).join(''):'<div class="empty">No members yet.</div>'}</div></article>`).join(''):'<div class="empty">No group matches this filter.</div>';$('#groupCount').textContent=f==='all'?`${list.length} groups`:f}
function render(){renderDuty();renderRoles();renderGroups()}
['dayFilter','groupFilter','roleFilter'].forEach(id=>$('#'+id).onchange=render);$('#clearFilters').onclick=()=>{$('#dayFilter').value='all';$('#groupFilter').value='all';$('#roleFilter').value='all';render()};
$('#fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){try{window.moveTo(0,0);window.resizeTo(screen.availWidth||1400,screen.availHeight||900)}catch(_){}}};document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fullscreen',!!document.fullscreenElement));$('#closeBtn').onclick=()=>window.close();
window.addEventListener('storage',e=>{if([CC_STORE,DUTY_STORE,ROLES_STORE,GROUPS_STORE].includes(e.key))location.reload()});try{window.moveTo(0,0);window.resizeTo(screen.availWidth||1400,screen.availHeight||900)}catch(e){}
render();
const launcher=document.createElement('script');launcher.src='embedded-launcher.js?v=20261003embedded8';launcher.dataset.currentTool='class-organisation-dashboard';document.body.appendChild(launcher);
</script>
</body>
</html>
