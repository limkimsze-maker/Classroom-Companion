<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Classroom Support</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--ink:#17202a;--muted:#667085;--line:#d8e1e8;--red:#b42318;--shadow:0 18px 55px rgba(18,32,46,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 8%,#fff 0,#f2f8f7 35%,#e8f0f3 100%);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;padding:16px;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:12px;max-width:1320px;width:100%;margin:0 auto 14px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:22px;padding:11px 13px;box-shadow:0 10px 30px rgba(18,32,46,.08);backdrop-filter:blur(12px);position:relative;z-index:5}.toolIcon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--teal2);font-size:28px}.meta{min-width:0;flex:1}.toolTitle{font-size:20px;font-weight:1000;color:var(--navy);letter-spacing:-.02em}.toolHint{font-size:12px;color:var(--muted);font-weight:750;margin-top:3px}.topActions,.controls,.classBar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.btn{min-height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);padding:9px 13px;font-weight:950}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.soft{background:var(--teal2);border-color:#9dd9d0;color:#0a5d57}.btn.danger{background:#fff3f1;border-color:#f0b1a9;color:var(--red)}.stage{max-width:1320px;width:100%;margin:auto;flex:1;display:flex;align-items:center;justify-content:center}.panel{width:min(1120px,100%);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:30px;padding:clamp(20px,3vw,42px);box-shadow:var(--shadow);text-align:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);font-weight:1000;margin-bottom:10px}.hero{font-size:clamp(46px,9vw,118px);line-height:.98;font-weight:1000;color:var(--navy);letter-spacing:-.05em;margin:8px auto 16px;max-width:1000px;overflow-wrap:anywhere}.hero.small{font-size:clamp(32px,5.5vw,68px);line-height:1.08}.supportText{font-size:clamp(16px,1.8vw,25px);line-height:1.4;color:var(--muted);font-weight:800;max-width:900px;margin:0 auto 22px}.choiceGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px auto;max-width:1000px}.choice{min-height:96px;border:1px solid var(--line);border-radius:20px;background:#fff;padding:14px;text-align:left;box-shadow:0 7px 20px rgba(18,32,46,.06);color:var(--navy)}.choice:hover,.choice.active{border-color:#6cc6ba;background:linear-gradient(145deg,#fff,#ebf9f6)}.choiceIcon{font-size:28px;display:block;margin-bottom:7px}.choiceTitle{font-size:15px;font-weight:1000;display:block}.choiceSub{font-size:11px;color:var(--muted);font-weight:750;display:block;margin-top:3px;line-height:1.3}.classBar{margin:0 auto 18px}.classSelect{min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 10px;font-weight:900;color:var(--navy);min-width:190px}.resultCard{max-width:760px;margin:18px auto 0;background:linear-gradient(145deg,#fff,#f3faf8);border:1px solid #cfe5e1;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(15,118,110,.08)}.resultName{font-size:clamp(42px,8vw,96px);line-height:1;font-weight:1000;color:var(--navy);letter-spacing:-.045em}.resultMeta{font-size:14px;color:var(--teal);font-weight:900;margin-top:10px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:22px;text-align:left}.group{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 7px 20px rgba(18,32,46,.06)}.group h3{margin:0 0 10px;color:var(--teal);font-size:20px}.member{padding:8px 0;border-bottom:1px solid #edf1f3;font-weight:900;color:var(--navy)}.member:last-child{border-bottom:0}.timerRing{width:min(62vw,420px);aspect-ratio:1;border-radius:50%;margin:8px auto 20px;display:grid;place-items:center;background:conic-gradient(var(--teal) var(--progress,100%),#e7efef 0);position:relative}.timerRing::before{content:'';position:absolute;inset:18px;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 1px #edf1f2}.timerValue{position:relative;z-index:1;font-size:clamp(54px,10vw,100px);font-weight:1000;color:var(--navy);letter-spacing:-.05em;font-variant-numeric:tabular-nums}.pulse{animation:pulse .65s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.035);box-shadow:0 0 0 14px rgba(245,158,11,.09)}}.signal{font-size:clamp(68px,15vw,180px);font-weight:1000;color:var(--navy);line-height:.9;letter-spacing:-.06em;min-height:1em}.noiseBadge{width:min(78vw,700px);min-height:220px;margin:10px auto 18px;border-radius:32px;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fff,#ecf8f6);border:2px solid #a5d9d2}.noiseBig{font-size:clamp(42px,9vw,100px);font-weight:1000;color:var(--navy)}.spinnerDisc{width:min(60vw,410px);aspect-ratio:1;border-radius:50%;margin:4px auto 20px;border:16px solid var(--teal2);background:radial-gradient(circle,#fff 0 44%,#eef9f7 45% 100%);display:grid;place-items:center;box-shadow:0 15px 35px rgba(15,118,110,.10);transition:transform .7s cubic-bezier(.2,.8,.2,1)}.spinnerDisc.spin{transform:rotate(720deg)}.spinnerWord{font-size:clamp(27px,5vw,52px);font-weight:1000;color:var(--navy);padding:28px}.confidenceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1000px;margin:22px auto}.confidence{min-height:145px;border-radius:24px;border:1px solid var(--line);background:#fff;padding:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.confidence:hover{transform:translateY(-2px);border-color:#72c9be;background:#f0faf8}.confidence .face{font-size:42px}.confidence .label{font-size:16px;font-weight:1000;color:var(--navy)}.confidence .sub{font-size:11px;color:var(--muted);font-weight:750}.quoteMark{font-size:58px;color:#8bcfc5;line-height:.8}.quoteText{font-size:clamp(29px,5vw,60px);line-height:1.16;font-weight:1000;color:var(--navy);max-width:1000px;margin:10px auto 24px;letter-spacing:-.025em}.breakMove{font-size:clamp(36px,7vw,78px);font-weight:1000;color:var(--navy);max-width:900px;margin:8px auto 20px}.timetable{max-width:900px;margin:16px auto;text-align:left}.timeRow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:9px}.timeInput,.activityInput{width:100%;min-height:40px;border:1px solid transparent;border-radius:10px;padding:7px 8px;background:transparent;font-weight:900;color:var(--navy)}.timeInput{color:var(--teal)}.timeInput:focus,.activityInput:focus{outline:3px solid rgba(15,118,110,.13);border-color:#65c4b8;background:#fff}.removeRow{width:38px;height:38px;border:0;border-radius:10px;background:#fff1ef;color:var(--red);font-weight:1000}.emptyState{padding:32px;border:1px dashed #b9c8cd;border-radius:22px;color:var(--muted);font-weight:850;background:#fbfcfd}.miniHint{font-size:11px;color:var(--muted);font-weight:750;margin-top:12px}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);background:#17202a;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s;z-index:2147483647}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.shell{padding:8px}.top{margin-bottom:8px;border-radius:17px;padding:9px}.toolIcon{width:44px;height:44px;font-size:23px}.toolTitle{font-size:16px}.toolHint{font-size:10px}.topActions .label{display:none}.panel{border-radius:22px;padding:18px}.confidenceGrid{grid-template-columns:repeat(2,1fr)}.confidence{min-height:118px}.choiceGrid{grid-template-columns:repeat(2,1fr)}.timeRow{grid-template-columns:82px 1fr auto}.classBar{align-items:stretch}.classSelect{min-width:0;flex:1 1 180px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="toolIcon" id="toolIcon">✦</div><div class="meta"><div class="toolTitle" id="toolTitle">Classroom Support</div><div class="toolHint" id="toolHint">Ready to help pupils learn.</div></div><div class="topActions"><button class="btn soft hidden" id="classBtn">👥 <span class="label">Class</span></button><button class="btn" id="closeBtn">✕ <span class="label">Close</span></button></div></header>
<main class="stage"><section class="panel" id="panel"></section></main>
</div>
<div class="toast" id="toast"></div>
<script src="support-core.js?v=20261004core2"></script>
<script src="support-tools.js?v=20261003core1"></script>
<script src="pick-spinner-enhancement.js?v=20261004pick5"></script>
<script src="timetable-enhancement-v4.js?v=20261004ocr5"></script>
<script src="timetable-profile-selector.js?v=20261004ocr5"></script>
<script src="timetable-excel-import.js?v=20261004ocr5"></script>
<script>
(function(){
 if(new URLSearchParams(location.search).get('tool')!=='daily-visual-timetable')return;
 function fix(){document.querySelectorAll('.ttCell').forEach(i=>{if(String(i.value||'').trim().toUpperCase()==='SCX'){i.value='SC';i.dispatchEvent(new Event('input',{bubbles:true}))}})}
 const panel=document.getElementById('panel');if(!panel)return;new MutationObserver(()=>requestAnimationFrame(fix)).observe(panel,{childList:true,subtree:true});setTimeout(fix,0);
})();
</script>
</body>
</html>
